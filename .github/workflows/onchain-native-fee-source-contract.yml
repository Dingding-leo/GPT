name: On-chain Native Fee Source Contract 1H

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_onchain_native_fee_source_contract.py'
      - 'scripts/run_onchain_native_fee_source_contract_repaired.py'
      - '.github/workflows/onchain-native-fee-source-contract.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind evidence to exact pull-request head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --quiet
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prove prohibited capabilities are absent
        shell: bash
        run: |
          set -euo pipefail
          if env | cut -d= -f1 | grep -Eiq \
            '(COINMETRICS|OKX|BINANCE).*(SECRET|TOKEN|KEY)'; then
            exit 1
          fi
          ! grep -nEi \
            'place_order|create_order|submit_order|send_order|/api/v5/(account|trade|asset)' \
            scripts/run_onchain_native_fee_source_contract.py \
            scripts/run_onchain_native_fee_source_contract_repaired.py

      - name: Compile frozen source experiment
        run: >-
          python -m py_compile
          scripts/run_onchain_native_fee_source_contract.py
          scripts/run_onchain_native_fee_source_contract_repaired.py

      - name: Execute immutable public-data source contract
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA='${{ github.event.pull_request.head.sha }}'
          python scripts/run_onchain_native_fee_source_contract_repaired.py

      - name: Validate machine-readable source evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          family = 'causal-onchain-native-fee-pressure-source-contract-1h-v1'
          root = Path('reports/experiments') / family
          evidence_path = root / 'evidence.json'
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          assert evidence['family_id'] == family
          assert evidence['exact_head'] == '${{ github.event.pull_request.head.sha }}'
          assert evidence['candidate_count'] == 0
          assert evidence['parameter_grid_count'] == 0
          assert evidence['fixed_targets'] == ['BTC-USDT', 'ETH-USDT']
          assert evidence['metric'] == 'FeeTotNtv'
          assert evidence['frequency'] == '1h'
          assert evidence['bar_interval'] == '1H'
          assert evidence['expected_rows_per_arm'] == 24144
          assert evidence['canonical_fee_bps_one_way'] == 5.0
          assert evidence['public_data_only'] is True
          assert evidence[
              'credentials_private_endpoints_accounts_orders_adapters_leverage_funds'
          ] is False
          assert evidence['cross_sectional_or_contemporaneous_selection'] is False
          assert evidence['canonical_strategy_changed'] is False
          assert evidence['paper_trading_authorized'] is False
          assert evidence['live_trading_authorized'] is False
          assert evidence['performance_accessed'] is False
          assert evidence['oos_accessed'] is False
          assert all(value is None for value in evidence['performance'].values())
          accepted = (
              'accept_onchain_native_fee_pressure_1h_source_for_separate_'
              'training_only_predeclaration'
          )
          rejected = 'reject_causal_onchain_native_fee_pressure_source_contract_1h_v1'
          assert evidence['verdict'] in {accepted, rejected}
          if evidence['source_contract_passed']:
              assert evidence['verdict'] == accepted
              assert evidence['source_arms_passing'] == 2
              assert len(evidence['markets']) == 2
              assert evidence['official_semantics']['semantic_gate_passed'] is True
              assert evidence['official_semantics']['burned_fee_accounting_documented'] is True
              assert evidence['official_semantics']['direct_1h_documentation_support'] is True
              for market in evidence['markets']:
                  assert market['source_gate_passed'] is True
                  assert market['expected_rows'] == 24144
                  assert market['observed_rows'] == 24144
                  assert market['gap_count'] == 0
                  assert market['conflicting_duplicate_count'] == 0
                  assert market['repeat_normalization_identical'] is True
                  assert market['future_prefix_identical'] is True
          else:
              assert evidence['verdict'] == rejected
              assert 0 <= evidence['source_arms_passing'] < 2
              assert evidence['failure'] is not None
          for filename in ('evidence', 'report'):
              path = root / f'{filename}.json' if filename == 'evidence' else root / 'report.md'
              expected = (root / f'{filename}.sha256').read_text().strip()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          manifest = root / 'artifact-manifest.json'
          expected_manifest = (root / 'manifest.sha256').read_text().strip()
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == expected_manifest
          print(json.dumps({
              'exact_head': evidence['exact_head'],
              'source_arms_passing': evidence['source_arms_passing'],
              'source_contract_passed': evidence['source_contract_passed'],
              'performance_accessed': evidence['performance_accessed'],
              'oos_accessed': evidence['oos_accessed'],
              'verdict': evidence['verdict'],
              'evidence_sha256': hashlib.sha256(evidence_path.read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY

      - name: Upload immutable source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onchain-native-fee-source-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: reports/experiments/causal-onchain-native-fee-pressure-source-contract-1h-v1
          if-no-files-found: error
          retention-days: 14
