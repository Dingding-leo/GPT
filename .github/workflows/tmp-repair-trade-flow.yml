name: Temporary Trade Flow Repair

on:
  push:
    branches:
      - auto/research/20260728-23-trade-flow-schema-checkpoint

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/acquire_okx_historical_trades.py")
          text = path.read_text()
          if "from itertools import pairwise\n" not in text:
              text = text.replace(
                  "from decimal import Decimal\n",
                  "from decimal import Decimal\nfrom itertools import pairwise\n",
                  1,
              )
          old = "left[5] > right[5] for left, right in zip(trade_id_order, trade_id_order[1:], strict=True)"
          new = "left[5] > right[5] for left, right in pairwise(trade_id_order)"
          if old not in text:
              raise SystemExit("expected inversion expression not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff check --fix scripts/acquire_okx_historical_trades.py
      - run: ruff format scripts/acquire_okx_historical_trades.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/acquire_okx_historical_trades.py
          git commit -m "fix: use pairwise for trade-id chronology [skip repair]"
          git push origin HEAD:${GITHUB_REF_NAME}
