name: Prospective Simple Trend Shadow 0900

on:
  pull_request:
    branches:
      - auto/research/20260729-09-prospective-simple-trend-shadow-0800
    paths:
      - "scripts/run_prospective_simple_trend_shadow_0900.py"
      - ".github/workflows/prospective-simple-trend-shadow-0900.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-simple-trend-0900-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      OUTPUT_DIR: reports/prospective/simple-trend-20260729T0900Z
      ARTIFACT_NAME: prospective-simple-trend-0900-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public-only exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify and execute frozen strategy update
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_prospective_simple_trend_shadow_1800.py \
            scripts/run_prospective_simple_trend_shadow_0100.py \
            scripts/run_prospective_simple_trend_shadow_0600.py \
            scripts/run_prospective_simple_trend_shadow_0700.py \
            scripts/run_prospective_simple_trend_shadow_0800.py \
            scripts/run_prospective_simple_trend_shadow_0900.py
          python scripts/run_prospective_simple_trend_shadow_0900.py \
            --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable strategy evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["policy_name"] == "simple_trend_long_cash_2160h_next_open"
          assert result["policy_sha256"] == "9dc8ab03368b61546a6ae7674f1f4127953404900ff1e09e066ecf9adf741131"
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["cross_sectional_selection"] is False
          assert result["actual_orders"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["enabled_adapters"] is False
          assert result["live_trading_authorized"] is False
          assert result["paper_trading_authorized"] is False
          assert result["window"]["prior_last_signal_bar_start"] == "2026-07-29T08:00:00Z"
          assert result["window"]["latest_complete_signal_bar_start"] == "2026-07-29T09:00:00Z"
          assert result["window"]["new_signal_bar_count"] == 1
          assert result["window"]["new_realized_payoff_intervals"] == 1
          assert result["window"]["prior_cumulative_realized_hours"] == 511
          assert result["window"]["updated_cumulative_realized_hours"] == 512
          assert result["prospective_lineage"]["prior_result_sha256"] == "fe0d3c5ca1fe21b0d42d0725b88180a0b6bb62d2be61d23e3a138e5f4c33f5e7"
          assert result["prospective_lineage"]["prior_artifact_sha256"] == "1e1e3739090186838530acdbeeea5d2a59a7a7e351781dcc8ed03f1282bdf397"
          assert result["prospective_lineage"]["policy_unchanged"] is True
          assert result["training_authorized_correction"]["applied"] is False
          assert result["active_alpha_context"]["issue"] == 614
          assert len(result["markets"]) == 2
          assert all(m["recent_forward_window"]["realized_interval_count"] == 5 for m in result["markets"])
          assert all(s["grid"]["contiguous_confirmed_grid_passed"] is True for s in result["sources"])
          assert result["abort_conditions"]["triggered"] is False
          assert result["verdict"] in {
              "prospective_simple_trend_no_trade_continues",
              "prospective_simple_trend_exposure_observed_continue_shadow_only",
          }
          PY

      - name: Upload immutable prospective evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
