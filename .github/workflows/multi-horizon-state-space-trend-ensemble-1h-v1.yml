name: Multi-Horizon State Space Trend Ensemble 1H Research

on:
  pull_request:
    paths:
      - ".github/workflows/multi-horizon-state-space-trend-ensemble-1h-v1.yml"
      - "reports/research/multi-horizon-local-linear-trend-ensemble-1h-v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed research dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6"

      - name: Materialize and compile deterministic reproducer
        run: |
          python reports/research/multi-horizon-local-linear-trend-ensemble-1h-v1/run_state_space_ensemble.py \
            --materialize /tmp/run_state_space_ensemble.py
          python -m py_compile /tmp/run_state_space_ensemble.py
          sha256sum /tmp/run_state_space_ensemble.py

      - name: Run immutable public-data experiment
        run: |
          mkdir -p /tmp/state-space-output /tmp/state-space-cache
          python /tmp/run_state_space_ensemble.py \
            --output-dir /tmp/state-space-output \
            --cache-dir /tmp/state-space-cache \
            | tee /tmp/state-space-output/stdout.json
          cp /tmp/run_state_space_ensemble.py \
            /tmp/state-space-output/materialized_source.py
          sha256sum /tmp/state-space-output/* | sort \
            > /tmp/state-space-output/artifact-files.sha256

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-horizon-local-linear-trend-ensemble-1h-v1
          path: /tmp/state-space-output
          if-no-files-found: error
          retention-days: 90
