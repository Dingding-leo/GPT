name: Apply Trade Flow Bounded Repair

on:
  push:
    branches:
      - auto/research/20260728-23-trade-flow-schema-checkpoint

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip bounded repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply bounded strategy-facing repair
        shell: bash
        run: |
          set -euo pipefail
          cat .trade-flow-bounded-repair/payload.*.b64 | base64 --decode > /tmp/tradeflow-repair.tar.gz
          echo "c3ec10b011335fd070b0e26b23243f58cc068013c26990f407fc3554ffcdecba  /tmp/tradeflow-repair.tar.gz" | sha256sum --check -
          tar -xzf /tmp/tradeflow-repair.tar.gz -C .
          python -m py_compile scripts/stress_okx_trade_flow_checkpoint.py tests/test_okx_historical_trades.py
      - name: Validate repair source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          ruff check --fix scripts/stress_okx_trade_flow_checkpoint.py tests/test_okx_historical_trades.py
          ruff format scripts/stress_okx_trade_flow_checkpoint.py tests/test_okx_historical_trades.py
          python -m py_compile scripts/stress_okx_trade_flow_checkpoint.py tests/test_okx_historical_trades.py
      - name: Commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .trade-flow-bounded-repair
          rm -f .github/workflows/apply-trade-flow-bounded-repair.yml
          rm -f reports/research/trade-flow-source-schema-checkpoint-v1/result-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(research): prove bounded two-sided trade-flow parity [skip bounded repair]"
          git push origin HEAD:${GITHUB_REF_NAME}
