name: DVOL Slow-Regime Veto E2160 1H V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_dvol_source_contract_1h_v1.py"
      - "scripts/dvol_slow_regime_veto_e2160_1h_v1_parts/**"
      - ".github/workflows/dvol-slow-regime-veto-e2160-1h-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvol-slow-regime-veto-e2160-1h-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  strategy-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/dvol-slow-regime-veto-e2160-1h-v1
      ARTIFACT_NAME: dvol-slow-regime-veto-e2160-1h-v1-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize frozen strategy script
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/dvol_slow_regime_veto_e2160_1h_v1_parts/part-*.txt > /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py
          test -s /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py

      - name: Verify exact public research boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"
          test -z "${{ secrets.DERIBIT_CLIENT_ID }}"
          test -z "${{ secrets.DERIBIT_CLIENT_SECRET }}"
          ! grep -EIn '(/private/|place_order\(|create_order\(|submit_order\(|send_order\()' \
            /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install exact research package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Canonicalize and verify focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py
          python -m py_compile \
            scripts/run_dvol_source_contract_1h_v1.py \
            /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py
          python -m ruff check /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py
          python -m ruff format --check /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py

      - name: Execute frozen bilateral strategy experiment
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/scripts:$GITHUB_WORKSPACE/src" \
            python /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py \
            --tested-head "$EXPECTED_TESTED_SHA" \
            --output-dir "$OUTPUT_DIR"
          cp /tmp/run_dvol_slow_regime_veto_e2160_1h_v1.py "$OUTPUT_DIR/strategy.py"
          sha256sum "$OUTPUT_DIR/strategy.py" | awk '{print $1}' > "$OUTPUT_DIR/strategy.sha256"

      - name: Verify machine-readable evidence and fail-closed policy
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/evidence.json"
          test -s "$OUTPUT_DIR/evidence.sha256"
          test -s "$OUTPUT_DIR/protocol.json"
          test -s "$OUTPUT_DIR/protocol.sha256"
          test -s "$OUTPUT_DIR/report.md"
          test -s "$OUTPUT_DIR/strategy.py"
          test -s "$OUTPUT_DIR/strategy.sha256"
          expected="$(cat "$OUTPUT_DIR/evidence.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          expected_strategy="$(cat "$OUTPUT_DIR/strategy.sha256")"
          actual_strategy="$(sha256sum "$OUTPUT_DIR/strategy.py" | awk '{print $1}')"
          test "$actual_strategy" = "$expected_strategy"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((root / "evidence.json").read_text())
          assert evidence["family_id"] == "causal-lagged-dvol-slow-regime-veto-e2160-1h-v1"
          assert evidence["tested_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["repository_main"] == "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          assert evidence["bar"] == "1H"
          assert evidence["modeled_fee_bps_one_way"] == 5.0
          assert evidence["candidate_count"] == 2
          assert evidence["parameter_grid_count"] == 0
          assert len(evidence["market_arms"]) == 2
          assert {arm["market"] for arm in evidence["market_arms"]} == {
              "BTC-USDT",
              "ETH-USDT",
          }
          assert evidence["synthetic_market_data_used"] is False
          assert evidence["cross_sectional_selection"] is False
          assert evidence["pairs_or_spreads"] is False
          assert evidence["market_neutral_or_long_short"] is False
          assert evidence["credentials_used"] is False
          assert evidence["private_endpoints_used"] is False
          assert evidence["accounts_or_orders"] is False
          assert evidence["enabled_adapters"] is False
          assert evidence["leverage_used"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          bilateral_training = all(
              arm["training_gate_passed"] for arm in evidence["market_arms"]
          )
          assert evidence["bilateral_training_gate_passed"] is bilateral_training
          assert evidence["oos_accessed"] is bilateral_training
          if not bilateral_training:
              assert evidence["full_sample_accessed"] is False
              assert all(arm["economics"] is None for arm in evidence["market_arms"])
              assert evidence["verdict"] == (
                  "reject_causal_lagged_dvol_slow_regime_veto_e2160_1h_v1"
              )
          else:
              assert evidence["full_sample_accessed"] is True
              assert all(arm["economics"] is not None for arm in evidence["market_arms"])
              expected_accept = all(
                  arm["oos_gate_passed"] for arm in evidence["market_arms"]
              )
              assert evidence["prospective_shadow_authorized"] is expected_accept
              if not expected_accept:
                  assert evidence["verdict"] == (
                      "reject_causal_lagged_dvol_slow_regime_veto_e2160_1h_v1"
                  )
          assert evidence["canonical_strategy_changed"] is False
          PY

      - name: Upload immutable strategy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
