name: Trade Flow Development Comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_trade_flow_research.py"
      - "scripts/run_trade_flow_research_exact.py"
      - "scripts/run_trade_flow_research_boundary.py"
      - ".github/workflows/trade-flow-development.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trade-flow-development-${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  format-sources:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Materialize reviewable formatted sources
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --exit-zero \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          ruff format \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          ruff check \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          ruff format --check \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          mkdir -p reports/research/trade-flow-formatted-sources
          cp scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py \
            reports/research/trade-flow-formatted-sources/
          printf '%s\n' "$EXPECTED_SHA" \
            > reports/research/trade-flow-formatted-sources/source-head-sha.txt
          find reports/research/trade-flow-formatted-sources -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/research/trade-flow-formatted-sources/file-sha256.txt

      - name: Commit exact formatting repair to the canonical PR branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          git commit -m "style: format trade-flow research sources"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload formatted source candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trade-flow-formatted-sources-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: reports/research/trade-flow-formatted-sources/
          if-no-files-found: error
          retention-days: 7

  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      EXPECTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      OUTPUT_DIR: reports/research/trade-flow-development

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision and public-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate entry points and capture lint debt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python -m py_compile \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py
          set +e
          ruff check \
            scripts/run_trade_flow_research.py \
            scripts/run_trade_flow_research_exact.py \
            scripts/run_trade_flow_research_boundary.py \
            2>&1 | tee "$OUTPUT_DIR/ruff-check.txt"
          ruff_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$ruff_status" > "$OUTPUT_DIR/ruff-exit-code.txt"

      - name: Execute frozen V1/V2 development comparison
        id: execute
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          df -h
          python scripts/run_trade_flow_research_boundary.py \
            --base-url "$OKX_BASE_URL" \
            --output-dir "$OUTPUT_DIR" \
            2>&1 | tee "$OUTPUT_DIR/execution.log"
          df -h

      - name: Write exact-head provenance
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          printf '%s\n' "$EXPECTED_SHA" > "$OUTPUT_DIR/tested-head-sha.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$OUTPUT_DIR/workflow-run-id.txt"
          printf '%s\n' "${{ steps.execute.outcome }}" > "$OUTPUT_DIR/execution-outcome.txt"
          find "$OUTPUT_DIR" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$OUTPUT_DIR/file-sha256.txt" || true

      - name: Upload immutable development evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trade-flow-development-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: reports/research/trade-flow-development/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce strategy execution result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("reports/research/trade-flow-development")
          raw = (root / "result.json").read_bytes()
          expected = (root / "result.sha256").read_text().strip()
          assert hashlib.sha256(raw).hexdigest() == expected
          result = json.loads(raw)
          assert result["architecture_family_id"] == "okx-spot-causal-trade-flow-resilience-v2"
          assert result["candidate_count"] == 2
          assert result["candidate_fold_evaluations"] == 48
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["reserved_oos_consumed"] is False
          assert result["review_driven_month_boundary_repair"][
              "all_overlaps_limited_to_boundary_hours"
          ] is True
          guard = result["review_driven_reserved_suffix_guard"]
          assert guard["economic_rows_at_or_after_end_inspected"] == 0
          assert guard["reserved_economic_suffix_unread"] is True
          assert sorted(guard["markets_with_unread_boundary"]) == [
              "BTC-USDT",
              "ETH-USDT",
          ]
          assert result["verdict"] in {
              "trade_flow_resilience_family_rejected",
              "trade_flow_resilience_nominated_for_untouched_archive_replication",
          }
          PY
