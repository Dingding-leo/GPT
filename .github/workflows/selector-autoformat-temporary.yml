name: Selector Autoformat Temporary

on:
  push:
    branches:
      - auto/research/20260728-19-selector-training-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: auto/research/20260728-19-selector-training-evidence
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.9,<1"
      - name: Format and push
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/gpt_quant/selector_evidence.py \
            src/gpt_quant/selector_protocol.py \
            tests/test_selector_evidence.py \
            tests/test_selector_protocol.py
          if git diff --quiet -- \
            src/gpt_quant/selector_evidence.py \
            src/gpt_quant/selector_protocol.py \
            tests/test_selector_evidence.py \
            tests/test_selector_protocol.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/gpt_quant/selector_evidence.py \
            src/gpt_quant/selector_protocol.py \
            tests/test_selector_evidence.py \
            tests/test_selector_protocol.py
          git commit -m "style: format selector protocol"
          git push origin HEAD:auto/research/20260728-19-selector-training-evidence
