name: OKX L2 Near-Touch Concentration Research

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_okx_l2_bid_replenishment_diagnostic.py"
      - "scripts/run_okx_l2_day_replay.py"
      - "scripts/run_okx_l2_concentration_diagnostic.py"
      - "scripts/run_okx_l2_concentration_source_gate.py"
      - "scripts/run_okx_l2_concentration_day_replay.py"
      - ".github/workflows/okx-l2-near-touch-concentration-research.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: okx-l2-near-touch-concentration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PIP_BOOTSTRAP_VERSION: "26.1.2"
  METADATA_ARTIFACT: okx-l2-concentration-metadata-${{ github.run_number }}-${{ github.run_attempt }}
  DAY_PREFIX: okx-l2-concentration-day
  FINAL_ARTIFACT: okx-l2-concentration-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      source_feasible: ${{ steps.contract.outputs.source_feasible }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify focused code
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e ".[dev]"
          python -m pip check
          ruff check --ignore E501 \
            scripts/run_okx_l2_bid_replenishment_diagnostic.py \
            scripts/run_okx_l2_day_replay.py \
            scripts/run_okx_l2_concentration_diagnostic.py \
            scripts/run_okx_l2_concentration_source_gate.py \
            scripts/run_okx_l2_concentration_day_replay.py
          python -m py_compile \
            scripts/run_okx_l2_bid_replenishment_diagnostic.py \
            scripts/run_okx_l2_day_replay.py \
            scripts/run_okx_l2_concentration_diagnostic.py \
            scripts/run_okx_l2_concentration_source_gate.py \
            scripts/run_okx_l2_concentration_day_replay.py
      - name: Freeze fresh 2024 source metadata
        run: |
          python scripts/run_okx_l2_concentration_source_gate.py \
            --base-url https://www.okx.com \
            --output-dir frozen-metadata
      - name: Verify metadata contract or terminal rejection
        id: contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("frozen-metadata")
          manifest_raw = (root / "source-manifest.json").read_bytes()
          manifest = json.loads(manifest_raw)
          assert manifest["family_id"] == "okx-l2-persistent-near-touch-concentration-asymmetry-1h-v1"
          feasible = bool(manifest.get("source_feasible"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_feasible={str(feasible).lower()}\n")
          if feasible:
              assert manifest["markets"] == ["BTC-USDT", "ETH-USDT"]
              assert len(manifest["anchor_dates_utc"]) == 24
              assert manifest["source_object_count"] == 48
              assert manifest["byte_gate_passed"] is True
              assert manifest["economic_values_read"] is False
              assert manifest["largest_object_bytes"] <= manifest["per_object_ceiling_bytes"]
              assert manifest["declared_compressed_bytes"] <= manifest["cumulative_ceiling_bytes"]
          else:
              raw = (root / "evidence.json").read_bytes()
              evidence = json.loads(raw)
              assert evidence["candidate_count"] == 0
              assert evidence["source_feasible"] is False
              assert evidence["economic_values_read"] is False
              assert evidence["verdict"] == "reject_public_okx_l2_concentration_source_feasibility"
              assert evidence["source_manifest_sha256"] == hashlib.sha256(manifest_raw).hexdigest()
              assert (root / "report.md").is_file()
              print("terminal_evidence_sha256", hashlib.sha256(raw).hexdigest())
          print("metadata_sha256", hashlib.sha256(manifest_raw).hexdigest())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata/
          if-no-files-found: error
          retention-days: 30

  process-day:
    needs: metadata
    if: needs.metadata.outputs.source_feasible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        market: [BTC-USDT, ETH-USDT]
        anchor:
          - "2024-01-03"
          - "2024-01-17"
          - "2024-02-07"
          - "2024-02-21"
          - "2024-03-06"
          - "2024-03-20"
          - "2024-04-03"
          - "2024-04-17"
          - "2024-05-01"
          - "2024-05-15"
          - "2024-06-05"
          - "2024-06-19"
          - "2024-07-03"
          - "2024-07-17"
          - "2024-08-07"
          - "2024-08-21"
          - "2024-09-04"
          - "2024-09-18"
          - "2024-10-02"
          - "2024-10-16"
          - "2024-11-06"
          - "2024-11-20"
          - "2024-12-04"
          - "2024-12-18"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e .
          python -m pip check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata
      - name: Replay one immutable L2 day
        run: |
          python scripts/run_okx_l2_concentration_day_replay.py \
            --manifest-path frozen-metadata/source-manifest.json \
            --market "${{ matrix.market }}" \
            --anchor "${{ matrix.anchor }}" \
            --output-dir processed-day
      - name: Verify day artifact
        env:
          MARKET: ${{ matrix.market }}
          ANCHOR: ${{ matrix.anchor }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("processed-day") / f"{os.environ['MARKET']}-{os.environ['ANCHOR']}.json"
          item = json.loads(path.read_text())
          assert item["family_id"] == "okx-l2-persistent-near-touch-concentration-asymmetry-1h-v1"
          assert item["market"] == os.environ["MARKET"]
          assert item["anchor_date_utc"] == os.environ["ANCHOR"]
          assert item["sequence_continuity_passed"] is True
          assert item["source_day_complete"] is True
          assert item["boundary_count"] == 289
          assert item["valid_hour_count"] >= 23
          assert len(item["compressed_sha256"]) == 64
          for state in item["hourly_states"]:
              if state["valid"]:
                  assert state["boundary_observations"] == 13
                  assert state["state"] is not None
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DAY_PREFIX }}-${{ matrix.market }}-${{ matrix.anchor }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: processed-day/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [metadata, process-day]
    if: needs.metadata.outputs.source_feasible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e .
          python -m pip check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.DAY_PREFIX }}-*-${{ github.run_number }}-${{ github.run_attempt }}
          path: processed-days
          merge-multiple: true
      - name: Compute labels, uncertainty, delay and verdict
        run: |
          python scripts/run_okx_l2_concentration_diagnostic.py aggregate \
            --manifest-path frozen-metadata/source-manifest.json \
            --days-root processed-days \
            --output-dir final-evidence
      - name: Verify terminal strategy evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("final-evidence")
          raw = (root / "evidence.json").read_bytes()
          evidence = json.loads(raw)
          manifest_raw = (root / "source-manifest.json").read_bytes()
          assert evidence["family_id"] == "okx-l2-persistent-near-touch-concentration-asymmetry-1h-v1"
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_oos_consumed"] is False
          assert evidence["timeframe"] == "1H"
          assert evidence["fee_one_way"] == 0.0005
          assert evidence["round_trip_label_fee"] == 0.001
          assert evidence["label_horizon_hours"] == 6
          assert evidence["source"]["object_count"] == 48
          assert evidence["source"]["source_days_complete"] == 48
          assert evidence["source_manifest_sha256"] == hashlib.sha256(manifest_raw).hexdigest()
          for market in ("BTC-USDT", "ETH-USDT"):
              assert evidence["primary"][market]["observations"] >= 528
              assert evidence["one_hour_delay"][market]["observations"] >= 528
          assert evidence["verdict"] in {
              "accept_okx_l2_persistent_near_touch_concentration_information_premise",
              "reject_okx_l2_persistent_near_touch_concentration_information_premise",
          }
          for name in ("report.md", "evidence.json", "source-manifest.json"):
              assert (root / name).is_file()
          print("evidence_sha256", hashlib.sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.FINAL_ARTIFACT }}
          path: final-evidence/
          if-no-files-found: error
          retention-days: 30
