name: Forward IV Regime Family Closure 1H V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_forward_iv_regime_family_closure_1h_v1.py"
      - ".github/workflows/forward-iv-regime-family-closure-1h-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-iv-regime-family-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  family-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/forward-iv-regime-family-closure-1h-v1
      ARTIFACT_NAME: forward-iv-regime-family-closure-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify evidence-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Build deterministic closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_forward_iv_regime_family_closure_1h_v1.py
          python scripts/run_forward_iv_regime_family_closure_1h_v1.py \
            --tested-head "$EXPECTED_TESTED_SHA" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify frozen family verdict
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/evidence.json"
          test -s "$OUTPUT_DIR/evidence.sha256"
          test -s "$OUTPUT_DIR/report.md"
          test -s "$OUTPUT_DIR/report.sha256"
          test "$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/evidence.sha256")"
          test "$(sha256sum "$OUTPUT_DIR/report.md" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/report.sha256")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads((Path(os.environ["OUTPUT_DIR"]) / "evidence.json").read_text())
          assert evidence["family_id"] == (
              "causal-forward-implied-volatility-regime-family-closure-1h-v1"
          )
          assert evidence["tested_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["repository_main"] == (
              "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          )
          assert evidence["bar"] == "1H"
          assert evidence["modeled_fee_bps_one_way"] == 5.0
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_market_data"] == 0
          assert evidence["new_oos_consumed"] == 0
          assert evidence["performance_recomputed"] is False
          assert evidence["synthetic_market_data_used"] is False
          assert evidence["cross_sectional_selection"] is False
          assert evidence["pairs_or_spreads"] is False
          assert evidence["market_neutral_or_long_short"] is False
          assert evidence["credentials_used"] is False
          assert evidence["private_endpoints_used"] is False
          assert evidence["accounts_or_orders"] is False
          assert len(evidence["source_records"]) == 2
          assert evidence["architecture_counts"]["source_valid_groups"] == 2
          assert evidence["architecture_counts"]["economically_supportive_groups"] == 0
          assert evidence["architecture_counts"]["bilateral_positive_return_groups"] == 0
          assert evidence["architecture_counts"]["temporal_support_groups"] == 0
          strategy = evidence["source_records"][1]
          assert strategy["training_gate_passed"] is False
          assert strategy["oos_accessed"] is False
          assert strategy["full_sample_accessed"] is False
          assert strategy["oos_metrics"] is None
          assert strategy["full_sample_metrics"] is None
          assert strategy["dependence_aware_uncertainty"] is None
          assert all(
              not item["support_nonzero"]
              for item in evidence["leave_one_group_out"].values()
          )
          assert evidence["canonical_strategy_changed"] is False
          assert evidence["prospective_shadow_authorized"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          assert evidence["verdict"] == (
              "reject_causal_forward_implied_volatility_regime_family"
          )
          nomination = evidence["next_architecture_nomination"]
          assert nomination["candidate_count_before_source_gate"] == 0
          assert nomination["performance_seen"] is False
          assert nomination["oos_accessed"] is False
          PY

      - name: Upload immutable closure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
