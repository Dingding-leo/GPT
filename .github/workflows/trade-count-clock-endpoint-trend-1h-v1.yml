name: Trade-Count-Clock Endpoint Trend 1H Research

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/trade-count-clock-endpoint-trend-1h-v1.yml"
      - "reports/research/causal-trade-count-clock-endpoint-trend-1h-v1/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to verify
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: trade-count-clock-${{ github.event_name }}-${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_TESTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          git cat-file -e "5a0fcc97d1a882f8223656c51f5bb8055f534e38^{commit}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install standalone research dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "ruff==0.16.1"

      - name: Materialize and validate frozen implementation
        run: |
          python reports/research/causal-trade-count-clock-endpoint-trend-1h-v1/run_research.py \
            --materialize artifacts/work/run_research_impl.py
          ruff check --fix --unsafe-fixes --ignore E501 artifacts/work/run_research_impl.py
          ruff format artifacts/work/run_research_impl.py
          ruff check --ignore E501 artifacts/work/run_research_impl.py
          python -m compileall -q artifacts/work/run_research_impl.py

      - name: Acquire immutable public data and run frozen experiment
        run: python artifacts/work/run_research_impl.py

      - name: Verify terminal evidence contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("reports/experiments/causal-trade-count-clock-endpoint-trend-1h-v1")
          evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
          assert evidence["family_id"] == "causal-trade-count-clock-endpoint-trend-1h-v1"
          assert evidence["exact_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["candidate_count"] == 2
          assert evidence["parameter_grid_count"] == 0
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["bar_interval"] == "1H"
          assert evidence["verdict"] in {
              "accept_causal_trade_count_clock_endpoint_trend_1h_v1",
              "reject_causal_trade_count_clock_endpoint_trend_1h_v1",
          }
          assert evidence["stage"] in {
              "source_contract_rejection",
              "training_support_rejection",
              "performance_complete",
          }
          if evidence["stage"] != "source_contract_rejection":
              assert evidence["source_contract"]["objects_verified"] == 132
              assert evidence["source_contract"]["symbols"] == ["APTUSDT", "LDOUSDT"]
          if evidence["stage"] == "performance_complete":
              assert len(evidence["markets"]) == 2
              assert evidence["oos_accessed"] is True
          else:
              assert evidence["oos_accessed"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          PY

      - name: Publish terminal report
        run: cat reports/experiments/causal-trade-count-clock-endpoint-trend-1h-v1/report.md

      - name: Prepare immutable evidence artifact
        run: |
          rm -rf reports/experiments/causal-trade-count-clock-endpoint-trend-1h-v1/source
          cp artifacts/work/run_research_impl.py \
            reports/experiments/causal-trade-count-clock-endpoint-trend-1h-v1/

      - name: Upload immutable research artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trade-count-clock-endpoint-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: reports/experiments/causal-trade-count-clock-endpoint-trend-1h-v1
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
