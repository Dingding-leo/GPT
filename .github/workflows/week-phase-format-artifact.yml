name: Week Phase Research Formatting Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_week_phase_deseasonalized_endpoint_trend.py"
      - ".github/workflows/week-phase-format-artifact.yml"

permissions:
  contents: write

concurrency:
  group: week-phase-format-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply repository lint and formatting rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_week_phase_deseasonalized_endpoint_trend.py")
          text = path.read_text()
          old = '''    o, h, l, c, vol, vol_ccy, vol_quote = vals
              if min(o, h, l, c) <= 0 or min(vol, vol_ccy, vol_quote) < 0:
                  raise ValueError("invalid non-positive price or negative volume")
              if h < max(o, l, c) or l > min(o, h, c):
                  raise ValueError("invalid OHLC ordering")
              confirm = int(row[8])
              if confirm != 1:
                  raise ValueError("unconfirmed candle")
              return Candle(int(row[0]), o, h, l, c, vol, vol_ccy, vol_quote, confirm)
          '''
          new = '''    open_px, high_px, low_px, close_px, vol, vol_ccy, vol_quote = vals
              if min(open_px, high_px, low_px, close_px) <= 0 or min(
                  vol, vol_ccy, vol_quote
              ) < 0:
                  raise ValueError("invalid non-positive price or negative volume")
              if high_px < max(open_px, low_px, close_px) or low_px > min(
                  open_px, high_px, close_px
              ):
                  raise ValueError("invalid OHLC ordering")
              confirm = int(row[8])
              if confirm != 1:
                  raise ValueError("unconfirmed candle")
              return Candle(
                  int(row[0]),
                  open_px,
                  high_px,
                  low_px,
                  close_px,
                  vol,
                  vol_ccy,
                  vol_quote,
                  confirm,
              )
          '''
          if text.count(old) == 1:
              path.write_text(text.replace(old, new))
          elif "open_px, high_px, low_px, close_px" not in text:
              raise SystemExit("expected parser block not found")
          PY
          python -m pip install --disable-pip-version-check ruff==0.16.1
          ruff check --fix --unsafe-fixes scripts/run_week_phase_deseasonalized_endpoint_trend.py
          ruff format scripts/run_week_phase_deseasonalized_endpoint_trend.py
          ruff check scripts/run_week_phase_deseasonalized_endpoint_trend.py
          ruff format --check scripts/run_week_phase_deseasonalized_endpoint_trend.py
      - name: Commit exact formatting repair
        run: |
          if git diff --quiet -- scripts/run_week_phase_deseasonalized_endpoint_trend.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_week_phase_deseasonalized_endpoint_trend.py
          git commit -m "research: repair exact-head strategy lint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
