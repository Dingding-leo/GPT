name: Prospective Simple Trend Shadow 20260731 1700

on:
  pull_request:
    branches:
      - auto/research/20260801-0244-prospective-simple-trend-shadow-20260731-1600
    paths:
      - "scripts/run_prospective_simple_trend_shadow_20260731_1700.py"
      - ".github/workflows/prospective-simple-trend-shadow-20260731-1700.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-simple-trend-20260731-1700-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      OUTPUT_DIR: reports/prospective/simple-trend-20260731T1700Z
      ARTIFACT_NAME: prospective-simple-trend-20260731-1700-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public-only exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Execute frozen strategy update
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_prospective_simple_trend_shadow_1800.py \
            scripts/run_prospective_simple_trend_shadow_20260731_1400.py \
            scripts/run_prospective_simple_trend_shadow_20260731_1500.py \
            scripts/run_prospective_simple_trend_shadow_20260731_1600.py \
            scripts/run_prospective_simple_trend_shadow_20260731_1700.py
          python scripts/run_prospective_simple_trend_shadow_20260731_1700.py --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable strategy evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["policy_name"] == "simple_trend_long_cash_2160h_next_open"
          assert result["policy_sha256"] == "9dc8ab03368b61546a6ae7674f1f4127953404900ff1e09e066ecf9adf741131"
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["cross_sectional_selection"] is False
          assert result["actual_orders"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["enabled_adapters"] is False
          assert result["live_trading_authorized"] is False
          assert result["paper_trading_authorized"] is False
          assert result["window"]["prior_last_signal_bar_start"] == "2026-07-31T16:00:00Z"
          assert result["window"]["latest_complete_signal_bar_start"] == "2026-07-31T17:00:00Z"
          assert result["window"]["new_signal_bar_count"] == 1
          assert result["window"]["new_realized_payoff_intervals"] == 1
          assert result["window"]["prior_cumulative_realized_hours"] == 567
          assert result["window"]["updated_cumulative_realized_hours"] == 568
          assert result["prospective_lineage"]["prior_result_sha256"] == "95c8b47490f7ce2515b82aeebb2c9dbceddaa11718ac99b6994529ccc7aa012f"
          assert result["prospective_lineage"]["prior_artifact_sha256"] == "b6c297cbffbf00d54877d132f1e02ee8bdf6f12633f5fc4231883d3ed24f6038"
          assert result["prospective_lineage"]["policy_unchanged"] is True
          assert result["active_alpha_context"]["issue"] == 811
          assert result["active_alpha_context"]["pull_request"] == 812
          assert result["active_alpha_context"]["family_id"] == "coinm-liquidation-exhaustion-opportunity-diagnostic-1h-v1"
          assert result["active_alpha_context"]["status"] == "terminal_training_only_source_contract_aborted"
          assert result["active_alpha_context"]["candidate_count"] == 0
          assert result["active_alpha_context"]["parameter_grid_count"] == 0
          assert result["active_alpha_context"]["source_contract_complete"] is False
          assert result["active_alpha_context"]["requested_source_objects"] == 566
          assert result["active_alpha_context"]["verified_source_objects"] == 563
          assert result["active_alpha_context"]["failed_source_objects"] == 3
          assert result["active_alpha_context"]["training_diagnostic_evaluated"] is False
          assert result["active_alpha_context"]["candidate_performance_evaluated"] is False
          assert result["active_alpha_context"]["oos_accessed"] is False
          assert result["active_alpha_context"]["prospective_performance_consumed"] is False
          assert result["active_alpha_context"]["correction_permitted"] is False
          assert result["active_alpha_context"]["markets_passing_all_gates"] == 0
          assert result["active_alpha_context"]["verdict"] == "abort_fixed_source_contract_missing_public_objects"
          assert result["strategy_facing_discrepancy"]["policy_or_accounting_defect_detected"] is False
          assert len(result["markets"]) == 2
          assert all(m["recent_forward_window"]["realized_interval_count"] == 5 for m in result["markets"])
          assert all(s["grid"]["contiguous_confirmed_grid_passed"] is True for s in result["sources"])
          assert result["abort_conditions"]["triggered"] is False
          assert result["verdict"] in {
              "prospective_simple_trend_no_trade_continues",
              "prospective_simple_trend_exposure_observed_continue_shadow_only",
          }
          PY

      - name: Upload immutable prospective evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
