name: Three-Observation Intraday Onset Survival Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - "reports/research/three-observation-intraday-onset-survival-1h-v1/run_experiment.py"
      - ".github/workflows/three-observation-onset-survival-experiment.yml"

permissions:
  contents: read

concurrency:
  group: three-observation-onset-survival-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      SOURCE_DIR: /tmp/three-observation-onset-source
      OUTPUT_DIR: reports/research/three-observation-intraday-onset-survival-1h-v1/generated
      REPLAY_DIR: /tmp/three-observation-onset-replay
      ARTIFACT_NAME: three-observation-onset-survival-${{ github.run_id }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public-only exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m py_compile reports/research/three-observation-intraday-onset-survival-1h-v1/run_experiment.py

      - name: Acquire immutable public OKX 1H source
        run: |
          set -euo pipefail
          python scripts/run_okx_1h_coverage.py \
            --start 2021-07-24T00:00:00Z \
            --output-dir "$SOURCE_DIR" \
            --instrument EOS-USDT \
            --instrument XLM-USDT \
            --pause-seconds 0.08
          test -s "$SOURCE_DIR/coverage-manifest.json"
          test "$(find "$SOURCE_DIR/EOS-USDT/snapshot" -type f -name '*.csv' | wc -l)" -eq 1
          test "$(find "$SOURCE_DIR/XLM-USDT/snapshot" -type f -name '*.csv' | wc -l)" -eq 1

      - name: Run and replay frozen strategy experiment
        run: |
          set -euo pipefail
          COMMON_ARGS=(
            --data-root "$SOURCE_DIR"
            --instrument EOS-USDT
            --instrument XLM-USDT
            --resamples 5000
            --seed 20260731
            --source-workflow-run "$GITHUB_RUN_ID"
            --tested-sha "$EXPECTED_SHA"
          )
          python reports/research/three-observation-intraday-onset-survival-1h-v1/run_experiment.py \
            --output-dir "$OUTPUT_DIR" "${COMMON_ARGS[@]}"
          python reports/research/three-observation-intraday-onset-survival-1h-v1/run_experiment.py \
            --output-dir "$REPLAY_DIR" "${COMMON_ARGS[@]}"
          cmp "$OUTPUT_DIR/result.json" "$REPLAY_DIR/result.json"
          cmp "$OUTPUT_DIR/result-summary.json" "$REPLAY_DIR/result-summary.json"
          cmp "$OUTPUT_DIR/report.md" "$REPLAY_DIR/report.md"
          cp "$SOURCE_DIR/coverage-manifest.json" "$OUTPUT_DIR/coverage-manifest.json"
          printf '%s\n' "$EXPECTED_SHA" > "$OUTPUT_DIR/tested-sha.txt"
          printf '%s\n' deterministic_replay_byte_identical > "$OUTPUT_DIR/replay-verdict.txt"
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result-summary.json"
          test -s "$OUTPUT_DIR/report.md"
          sha256sum "$OUTPUT_DIR"/* > "$OUTPUT_DIR/artifact-manifest.sha256"

      - name: Verify machine-readable strategy evidence
        run: |
          set -euo pipefail
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["family_id"] == "three-observation-intraday-onset-survival-1h-v1"
          assert result["issue"] == 770
          assert result["tested_sha"] == os.environ["EXPECTED_SHA"]
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["candidate_count"] == 1
          assert result["parameter_grid_count"] == 0
          assert result["markets_independent"] is True
          assert result["cross_sectional_selection"] is False
          assert result["pairs_spreads_cointegration"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["actual_orders"] is False
          assert result["leverage"] is False
          assert result["synthetic_data"] is False
          assert result["paper_trading_authorized"] is False
          assert result["live_trading_authorized"] is False
          assert result["training_authorized_correction"]["permitted"] is False
          assert result["training_authorized_correction"]["applied"] is False
          assert result["strategy_facing_discrepancy"]["policy_or_accounting_defect_detected"] is False
          assert [m["instrument"] for m in result["markets"]] == ["EOS-USDT", "XLM-USDT"]
          assert all(m["source"]["frozen_prefix_rows"] == 43441 for m in result["markets"])
          assert all(m["source"]["frozen_start"] == "2021-07-24T00:00:00+00:00" for m in result["markets"])
          assert all(m["source"]["frozen_end"] == "2026-07-08T00:00:00+00:00" for m in result["markets"])
          assert result["verdict"] in {
              "accept_three_observation_intraday_onset_survival_family_shadow_only",
              "reject_three_observation_intraday_onset_survival_family",
          }
          PY

      - name: Upload immutable source and result evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.SOURCE_DIR }}/
            ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
