name: Multi Horizon Local Linear Trend Ensemble 1H Research

on:
  pull_request:
    paths:
      - ".github/workflows/multi-horizon-local-linear-trend-ensemble-1h-v1.yml"
      - "reports/research/multi-horizon-local-linear-trend-ensemble-1h-v1/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "ruff==0.16.1"

      - name: Materialize corrected deterministic reproducer
        run: |
          mkdir -p /tmp/local-linear-output
          {
            printf '%s\n' '# ruff: noqa: E501'
            cat reports/research/multi-horizon-local-linear-trend-ensemble-1h-v1/run_local_linear_ensemble.py
          } | sed 's/1_767_225_200_000/1_767_222_000_000/' \
            > /tmp/local-linear-output/materialized_source.py
          ruff check --fix /tmp/local-linear-output/materialized_source.py
          ruff format /tmp/local-linear-output/materialized_source.py
          ruff check /tmp/local-linear-output/materialized_source.py
          ruff format --check /tmp/local-linear-output/materialized_source.py
          python -m py_compile /tmp/local-linear-output/materialized_source.py
          sha256sum /tmp/local-linear-output/materialized_source.py

      - name: Run immutable public-data experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/local-linear-cache
          python /tmp/local-linear-output/materialized_source.py \
            --output-dir /tmp/local-linear-output \
            --cache-dir /tmp/local-linear-cache \
            | tee /tmp/local-linear-output/stdout.json
          find /tmp/local-linear-output -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/local-linear-output/artifact-files.sha256

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-horizon-local-linear-trend-ensemble-1h-v1
          path: /tmp/local-linear-output
          if-no-files-found: error
          retention-days: 90
