name: Transaction Cost Aware Online Specialist Arbitration 1H Research

on:
  pull_request:
    paths:
      - ".github/workflows/transaction-cost-aware-online-specialist-arbitration-1h-v1.yml"
      - "reports/research/transaction-cost-aware-online-specialist-arbitration-1h-v1/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RESEARCH_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  REPORT_DIR: reports/research/transaction-cost-aware-online-specialist-arbitration-1h-v1
  SOURCE_PATH: reports/research/transaction-cost-aware-online-specialist-arbitration-1h-v1/run_specialist_arbitration.py
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "ruff==0.16.1"

      - name: Materialize and validate deterministic reproducer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/specialist-output
          test -f "$SOURCE_PATH"
          cp "$SOURCE_PATH" /tmp/specialist-output/materialized_source.py
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/specialist-output/materialized_source.py")
          source = path.read_text(encoding="utf-8")
          old_hash = "    evidence_bytes = canonical_json_bytes(evidence)\n"
          new_hash = "    evidence_bytes = canonical_json_bytes(evidence) + b\"\\n\"\n"
          old_write = '    (args.output_dir / "evidence.json").write_bytes(evidence_bytes + b"\\n")\n'
          new_write = '    (args.output_dir / "evidence.json").write_bytes(evidence_bytes)\n'
          if old_hash in source and old_write in source:
              source = source.replace(old_hash, new_hash, 1).replace(old_write, new_write, 1)
          elif new_hash not in source or new_write not in source:
              raise RuntimeError("unexpected evidence serialization source")
          path.write_text(source, encoding="utf-8")
          PY
          ruff check --fix /tmp/specialist-output/materialized_source.py
          ruff format /tmp/specialist-output/materialized_source.py
          ruff check /tmp/specialist-output/materialized_source.py
          ruff format --check /tmp/specialist-output/materialized_source.py
          python -m py_compile /tmp/specialist-output/materialized_source.py
          sha256sum /tmp/specialist-output/materialized_source.py

      - name: Run immutable public-data experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/specialist-cache
          python /tmp/specialist-output/materialized_source.py \
            --output-dir /tmp/specialist-output \
            --cache-dir /tmp/specialist-cache \
            | tee /tmp/specialist-output/stdout.json
          (cd /tmp/specialist-output && sha256sum -c evidence.sha256)
          find /tmp/specialist-output -maxdepth 1 -type f \
            ! -name artifact-files.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/specialist-output/artifact-files.sha256

      - name: Persist exact reproducer and terminal evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/specialist-output/materialized_source.py "$SOURCE_PATH"
          cp /tmp/specialist-output/evidence.json "$REPORT_DIR/evidence.json"
          cp /tmp/specialist-output/evidence.sha256 "$REPORT_DIR/evidence.sha256"
          cp /tmp/specialist-output/report.md "$REPORT_DIR/report.md"
          git add -A "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo 'Terminal evidence already persisted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'research: repair terminal evidence checksum identity'
          git push origin "HEAD:$RESEARCH_BRANCH"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-cost-aware-online-specialist-arbitration-1h-v1
          path: /tmp/specialist-output
          if-no-files-found: error
          retention-days: 90
