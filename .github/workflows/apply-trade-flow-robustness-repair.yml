name: Apply Trade Flow Robustness Repair

on:
  push:
    branches:
      - auto/research/20260728-23-trade-flow-schema-checkpoint

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          cat .trade-flow-repair/script.*.b64 | base64 --decode > scripts/acquire_okx_historical_trades.py
          cat .trade-flow-repair/test.*.b64 | base64 --decode > tests/test_okx_historical_trades.py
          python -m py_compile scripts/acquire_okx_historical_trades.py tests/test_okx_historical_trades.py
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --fix scripts/acquire_okx_historical_trades.py tests/test_okx_historical_trades.py
      - run: ruff format scripts/acquire_okx_historical_trades.py tests/test_okx_historical_trades.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf .trade-flow-repair .github/workflows/apply-trade-flow-robustness-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(research): close trade-flow source-ordering false pass [skip repair]"
          git push origin HEAD:${GITHUB_REF_NAME}
