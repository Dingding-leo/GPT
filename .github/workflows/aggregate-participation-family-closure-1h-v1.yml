name: Aggregate Participation Family Closure 1H V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_aggregate_participation_family_closure_1h_v1.py"
      - ".github/workflows/aggregate-participation-family-closure-1h-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggregate-participation-family-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  family-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/aggregate-participation-family-closure-1h-v1
      ARTIFACT_NAME: aggregate-participation-family-closure-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify evidence-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Build deterministic closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_aggregate_participation_family_closure_1h_v1.py
          python scripts/run_aggregate_participation_family_closure_1h_v1.py \
            --tested-head "$EXPECTED_TESTED_SHA" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify frozen family verdict
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/evidence.json"
          test -s "$OUTPUT_DIR/evidence.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/evidence.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads((Path(os.environ["OUTPUT_DIR"]) / "evidence.json").read_text())
          assert evidence["family_id"] == "causal-aggregate-participation-information-family-closure-1h-v1"
          assert evidence["tested_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["repository_main"] == "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          assert evidence["bar"] == "1H"
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_market_data"] == 0
          assert evidence["new_oos_consumed"] == 0
          assert evidence["performance_recomputed"] is False
          assert evidence["synthetic_data_used"] is False
          assert evidence["cross_sectional_selection"] is False
          assert evidence["pairs_or_spreads"] is False
          assert evidence["market_neutral_or_long_short"] is False
          assert evidence["credentials_used"] is False
          assert evidence["private_endpoints_used"] is False
          assert evidence["accounts_or_orders"] is False
          assert len(evidence["source_records"]) == 3
          assert all(record["source_valid"] for record in evidence["source_records"])
          assert all(record["numerically_variable"] for record in evidence["source_records"])
          assert all(not record["bilateral_training_support_passed"] for record in evidence["source_records"])
          assert all(not record["performance_accessed"] for record in evidence["source_records"])
          assert all(not record["oos_accessed"] for record in evidence["source_records"])
          assert all(all(value is None for value in record["economics"].values()) for record in evidence["source_records"])
          assert evidence["architecture_counts"]["source_valid_groups"] == 3
          assert evidence["architecture_counts"]["numerically_variable_groups"] == 3
          assert evidence["architecture_counts"]["bilateral_supportive_groups"] == 0
          assert evidence["architecture_counts"]["oos_authorized_groups"] == 0
          assert evidence["family_gate_pass_count"] == 1
          assert evidence["family_gate_count"] == 10
          assert all(not value["support_nonzero"] for value in evidence["leave_one_group_out"].values())
          assert evidence["correction_permitted"] is False
          assert evidence["correction_applied"] is False
          assert evidence["observation_epoch_restarted"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          assert evidence["verdict"] == "reject_causal_aggregate_participation_information_family_1h_v1"
          assert evidence["next_architecture_nomination"]["candidate_count_before_source_gate"] == 0
          assert evidence["next_architecture_nomination"]["performance_seen"] is False
          assert evidence["next_architecture_nomination"]["oos_accessed"] is False
          PY

      - name: Upload immutable closure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
