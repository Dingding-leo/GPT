name: Large Trade Concentration Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_large_trade_concentration_diagnostic.py"
      - "scripts/run_large_trade_concentration_diagnostic_fixed.py"
      - ".github/workflows/large-trade-concentration-diagnostic.yml"
      - "scripts/acquire_okx_historical_trades.py"
      - "src/gpt_quant/okx_1h.py"
      - "src/gpt_quant/okx.py"

permissions:
  contents: read

concurrency:
  group: large-trade-concentration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      ARTIFACT_NAME: large-trade-concentration-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==26.1.2"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Materialize formatter and lint diagnostics
        shell: bash
        run: |
          set -euo pipefail
          output="reports/okx/large-trade-concentration-diagnostic/formatter"
          mkdir -p "$output"
          ruff format \
            scripts/run_large_trade_concentration_diagnostic.py \
            scripts/run_large_trade_concentration_diagnostic_fixed.py
          ruff check --fix \
            scripts/run_large_trade_concentration_diagnostic.py \
            scripts/run_large_trade_concentration_diagnostic_fixed.py \
            > "$output/ruff-check.txt" 2>&1
          ruff format \
            scripts/run_large_trade_concentration_diagnostic.py \
            scripts/run_large_trade_concentration_diagnostic_fixed.py
          cp scripts/run_large_trade_concentration_diagnostic.py "$output/formatted-script.py"
          cp scripts/run_large_trade_concentration_diagnostic_fixed.py "$output/repaired-wrapper.py"

      - name: Run immutable public-data strategy diagnostic
        id: strategy_diagnostic
        shell: bash
        run: |
          set +e
          output="reports/okx/large-trade-concentration-diagnostic"
          python scripts/run_large_trade_concentration_diagnostic_fixed.py \
            --output-dir "$output" > "$output/run.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$output/run-exit-code.txt"
          exit 0

      - name: Verify machine-readable verdict when available
        shell: bash
        run: |
          set -euo pipefail
          output="reports/okx/large-trade-concentration-diagnostic"
          if test -s "$output/result.json"; then
            test -s "$output/result.sha256"
            expected="$(cat "$output/result.sha256")"
            actual="$(sha256sum "$output/result.json" | awk '{print $1}')"
            test "$actual" = "$expected"
            test "$(cat "$output/run-exit-code.txt")" = "0"
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/okx/large-trade-concentration-diagnostic/result.json")
          result = json.loads(path.read_text())
          assert result["candidate_count"] == 1
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["bar"] == "1H"
          assert result["cross_sectional_selection"] is False
          assert result["reserved_trade_flow_oos_consumed"] is False
          assert len(result["markets"]) == 2
          assert all(
              market["leakage_and_timing"]["strict_zip_length_defect_repaired"]
              for market in result["markets"]
          )
          assert result["verdict"] in {
              "large_trade_concentration_pressure_promising_for_training_only_followup",
              "large_trade_concentration_pressure_rejected_by_bounded_diagnostic",
          }
          PY
          else
            cat "$output/run.log"
            exit 1
          fi

      - name: Upload immutable diagnostic artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: reports/okx/large-trade-concentration-diagnostic/
          if-no-files-found: error
          retention-days: 14
