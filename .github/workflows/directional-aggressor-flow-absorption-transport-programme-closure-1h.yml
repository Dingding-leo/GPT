name: Directional Aggressor Flow Absorption Closure 1H

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "reports/research/directional-aggressor-flow-absorption-transport-programme-closure-1h-v1/source-records.json"
      - "scripts/run_directional_aggressor_flow_absorption_transport_programme_closure_1h_v1.py"
      - ".github/workflows/directional-aggressor-flow-absorption-transport-programme-closure-1h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate frozen closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_directional_aggressor_flow_absorption_transport_programme_closure_1h_v1.py
          python scripts/run_directional_aggressor_flow_absorption_transport_programme_closure_1h_v1.py \
            --source reports/research/directional-aggressor-flow-absorption-transport-programme-closure-1h-v1/source-records.json \
            --output-dir closure-evidence \
            --tested-head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("closure-evidence")
          evidence = json.loads((root / "evidence.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          expected_head = "${{ github.event.pull_request.head.sha || github.sha }}"
          checks = {
              "family_id": "causal-directional-aggressor-flow-absorption-transport-programme-closure-1h-v1",
              "tested_head": expected_head,
              "frozen_at_main": "5a0fcc97d1a882f8223656c51f5bb8055f534e38",
              "top_level_group_count": 3,
              "supportive_top_level_group_count": 0,
              "new_candidate_count": 0,
              "parameter_grid_count": 0,
              "new_market_data_rows": 0,
              "new_target_labels": 0,
              "closure_gate_pass_count": 3,
              "closure_gate_total": 10,
              "verdict": "reject_reopening_completed_directional_aggressor_flow_absorption_mechanisms_1h_v1",
          }
          for key, expected in checks.items():
              if evidence.get(key) != expected:
                  raise SystemExit(f"{key}: {evidence.get(key)!r} != {expected!r}")
          if evidence["new_oos_access"] is not False or evidence["sealed_oos_accessed"] is not False:
              raise SystemExit("OOS contract violated")
          if evidence["canonical_mutation"] or evidence["paper_trading_authorized"] or evidence["live_trading_authorized"]:
              raise SystemExit("authority contract violated")
          if any(item["retained_supportive_groups"] != 0 for item in evidence["leave_one_top_level_group_out"]):
              raise SystemExit("leave-one-group-out support mismatch")
          if any(value is not None for value in evidence["strategy_metrics"].values()):
              raise SystemExit("closure strategy metrics must remain null")
          for name in ("evidence.json", "report.md", "source-records.json"):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if manifest.get(name) != actual:
                  raise SystemExit(f"hash mismatch: {name}")
          print(evidence["verdict"])
          print("EVIDENCE_SHA256", manifest["evidence.json"])
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directional-aggressor-flow-absorption-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: closure-evidence
          if-no-files-found: error
          retention-days: 90
