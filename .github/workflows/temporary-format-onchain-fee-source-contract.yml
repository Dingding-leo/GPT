name: Temporary Format On-chain Fee Source Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_onchain_fee_pressure_source_contract_1h_v1.py"
      - ".github/workflows/temporary-format-onchain-fee-source-contract.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ruff==0.16.1"
      - name: Apply repository formatter exactly once
        shell: bash
        run: |
          set -euo pipefail
          ruff format scripts/run_onchain_fee_pressure_source_contract_1h_v1.py
          if git diff --quiet -- scripts/run_onchain_fee_pressure_source_contract_1h_v1.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_onchain_fee_pressure_source_contract_1h_v1.py
          git commit -m "style: apply exact Ruff formatting to fee source audit"
          git push origin "HEAD:${{ github.head_ref }}"
