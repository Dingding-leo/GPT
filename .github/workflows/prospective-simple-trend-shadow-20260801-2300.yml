name: Prospective Simple Trend Shadow 20260801 2300

on:
  pull_request:
    branches:
      - auto/research/20260802-0844-prospective-simple-trend-shadow-20260801-2200
    paths:
      - "scripts/run_prospective_simple_trend_shadow_20260801_2300.py"
      - ".github/workflows/prospective-simple-trend-shadow-20260801-2300.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-simple-trend-20260801-2300-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      OUTPUT_DIR: reports/prospective/simple-trend-20260801T2300Z
      ARTIFACT_NAME: prospective-simple-trend-20260801-2300-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public-only exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Execute frozen strategy update
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_prospective_simple_trend_shadow_20260801_2300.py
          python scripts/run_prospective_simple_trend_shadow_20260801_2300.py --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable strategy evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["policy_name"] == "simple_trend_long_cash_2160h_next_open"
          assert result["policy_sha256"] == "9dc8ab03368b61546a6ae7674f1f4127953404900ff1e09e066ecf9adf741131"
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["cross_sectional_selection"] is False
          assert result["actual_orders"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["enabled_adapters"] is False
          assert result["paper_trading_authorized"] is False
          assert result["live_trading_authorized"] is False
          assert result["window"]["prior_last_signal_bar_start"] == "2026-08-01T22:00:00Z"
          assert result["window"]["latest_complete_signal_bar_start"] == "2026-08-01T23:00:00Z"
          assert result["window"]["new_signal_bar_count"] == 1
          assert result["window"]["new_realized_payoff_intervals"] == 1
          assert result["window"]["prior_cumulative_realized_hours"] == 597
          assert result["window"]["updated_cumulative_realized_hours"] == 598
          assert result["window"]["realized_payoff_interval_start"] == "2026-08-01T22:00:00Z"
          assert result["window"]["realized_payoff_interval_end"] == "2026-08-01T23:00:00Z"
          assert result["prospective_lineage"]["prior_result_sha256"] == "5edadced042f2fbf6e313d4c6e0b4ab5786b365c2f651dc6cd39f95034e9d9af"
          assert result["prospective_lineage"]["prior_artifact_sha256"] == "ab65c9eb98d4053571961126fade1720017fa992a2c41bc1d6491b462ff80512"
          assert result["prospective_lineage"]["policy_unchanged"] is True
          assert result["latest_terminal_candidate_context"]["issue"] == 931
          assert result["latest_terminal_candidate_context"]["pull_request"] == 932
          assert result["latest_terminal_candidate_context"]["source_arms_passing"] == 2
          assert result["latest_terminal_candidate_context"]["training_support_arms_passing"] == 0
          assert result["latest_terminal_candidate_context"]["performance_accessed"] is False
          assert result["latest_terminal_candidate_context"]["oos_accessed"] is False
          assert result["active_alpha_context"]["issue"] == 933
          assert result["active_alpha_context"]["candidate_count"] == 0
          assert result["active_alpha_context"]["parameter_grid_count"] == 0
          assert result["active_alpha_context"]["new_oos_consumed"] == 0
          assert result["training_authorized_correction"]["permitted"] is False
          assert result["training_authorized_correction"]["applied"] is False
          assert result["training_authorized_correction"]["observation_epoch_restarted"] is False
          assert result["strategy_facing_discrepancy"]["policy_or_accounting_defect_detected"] is False
          assert result["aggregate_forward_scorecard"]["realized_interval_count"] == 10
          assert len(result["markets"]) == 2
          assert all(m["recent_forward_window"]["realized_interval_count"] == 5 for m in result["markets"])
          assert all(s["grid"]["contiguous_confirmed_grid_passed"] is True for s in result["sources"])
          assert result["abort_conditions"]["triggered"] is False
          assert result["machine_readable_verdict"]["live_trading_authorized"] is False
          assert result["verdict"] in {
              "prospective_simple_trend_no_trade_continues",
              "prospective_simple_trend_exposure_observed_continue_shadow_only",
          }
          PY

      - name: Upload immutable prospective evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
