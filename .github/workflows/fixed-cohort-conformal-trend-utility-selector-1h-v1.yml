name: Fixed cohort conformal trend utility selector 1H v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  strategy-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUTPUT_DIR: evidence/fixed-cohort-conformal-trend-utility-selector-1h-v1

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Inspect immediate source-contract failure
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import runpy
          from pathlib import Path

          wrapper = Path("scripts/run_fixed_cohort_conformal_trend_utility_selector_1h_v1.py")
          namespace = runpy.run_path(str(wrapper), run_name="payload_inspection")
          source = gzip.decompress(
              base64.b85decode(namespace["_PAYLOAD"].encode("ascii"))
          ).decode("utf-8")
          for number, line in enumerate(source.splitlines(), start=1):
              print(f"{number:04d}: {line}")
          PY

      - name: Stop after deterministic diagnostic
        run: exit 1
