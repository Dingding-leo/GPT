name: OKX Funding Reset Episode 1H Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_okx_funding_reset_episode.py"
      - ".github/workflows/research-okx-funding-reset.yml"

permissions:
  contents: read

concurrency:
  group: okx-funding-reset-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  funding-reset-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research package
        run: python -m pip install .

      - name: Validate focused research module
        run: python -m py_compile scripts/research_okx_funding_reset_episode.py

      - name: Run immutable public-data diagnostic
        run: |
          python scripts/research_okx_funding_reset_episode.py \
            --output-dir artifacts/okx-funding-reset

      - name: Verify exact evidence identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/okx-funding-reset")
          evidence_bytes = (root / "evidence.json").read_bytes()
          evidence = json.loads(evidence_bytes)
          identities = json.loads((root / "identities.json").read_text())
          expected_sha = os.environ["EXPECTED_SHA"]

          assert evidence["exact_head"] == expected_sha
          assert identities["exact_head"] == expected_sha
          assert hashlib.sha256(evidence_bytes).hexdigest() == identities["evidence_sha256"]
          source_bytes = (root / "source-manifest.json").read_bytes()
          assert hashlib.sha256(source_bytes).hexdigest() == identities["source_manifest_sha256"]
          assert evidence["source_manifest_sha256"] == identities["source_manifest_sha256"]
          assert evidence["candidate_count"] == 0
          assert evidence["diagnostic_count"] == 1
          assert evidence["fee_one_way"] == 0.0005
          assert evidence["round_trip_label_fee"] == 0.001
          assert evidence["bar"] == "1H"
          assert evidence["verdict"] in {
              "accept_okx_settled_funding_positive_run_reset_opportunity_premise",
              "reject_okx_settled_funding_positive_run_reset_opportunity_premise",
              "reject_public_okx_funding_reset_source_feasibility",
          }
          print(json.dumps(identities, indent=2, sort_keys=True))
          PY

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: okx-funding-reset-${{ env.EXPECTED_SHA }}
          path: artifacts/okx-funding-reset
          if-no-files-found: error
          retention-days: 90
