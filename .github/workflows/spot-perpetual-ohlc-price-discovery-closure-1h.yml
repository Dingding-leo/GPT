name: Spot Perpetual OHLC Price Discovery Closure 1H

on:
  push:
    branches:
      - "auto/research/**"
    paths:
      - "scripts/run_spot_perpetual_ohlc_price_discovery_closure.py"
      - ".github/workflows/spot-perpetual-ohlc-price-discovery-closure-1h.yml"
  pull_request:
    paths:
      - "scripts/run_spot_perpetual_ohlc_price_discovery_closure.py"
      - ".github/workflows/spot-perpetual-ohlc-price-discovery-closure-1h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "RESEARCH_HEAD_SHA=$actual" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hard strategy boundary proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'CANDIDATE_COUNT = 0' scripts/run_spot_perpetual_ohlc_price_discovery_closure.py)" -eq 1
          test "$(grep -c 'PARAMETER_GRID_COUNT = 0' scripts/run_spot_perpetual_ohlc_price_discovery_closure.py)" -eq 1
          test "$(grep -c 'FEE_BPS_ONE_WAY = 5.0' scripts/run_spot_perpetual_ohlc_price_discovery_closure.py)" -eq 1
          ! grep -Eiq 'api[-_ ]?key|secret|order placement|15m|synthetic (price|candle|market data)' scripts/run_spot_perpetual_ohlc_price_discovery_closure.py

      - name: Compile closure
        run: python -m py_compile scripts/run_spot_perpetual_ohlc_price_discovery_closure.py

      - name: Execute immutable-evidence closure
        run: python scripts/run_spot_perpetual_ohlc_price_discovery_closure.py

      - name: Validate terminal artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          family = "causal-same-asset-spot-perpetual-ohlc-price-discovery-programme-closure-1h-v1"
          out = Path("reports/research") / family
          evidence = json.loads((out / "evidence.json").read_text())
          assert evidence["family_id"] == family
          assert evidence["issue_number"] == 1147
          assert evidence["base_main"] == "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          assert evidence["exact_head"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert evidence["bar"] == "1H"
          assert evidence["fee_bps_one_way_where_economics_defined"] == 5.0
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_market_rows"] == 0
          assert evidence["new_target_labels"] == 0
          assert evidence["new_oos_observations"] == 0
          assert evidence["new_fitting_or_tuning"] == 0
          assert evidence["top_level_group_count"] == 2
          assert evidence["independently_admissible_groups"] == 0
          assert evidence["retention_gates_passed"] == 5
          assert evidence["retention_gates_total"] == 10
          assert evidence["retention_gates"]["04_at_least_one_original_bilateral_mechanism_admissible"] is False
          assert all(x["independently_admissible_groups"] == 0 for x in evidence["leave_one_group_out"])
          assert evidence["groups"][0]["evidence_sha256"] == "416bd865677d34fd0c405e39277073bd2a55bdfefb3837bbee6f0fd48ff3ea3f"
          assert evidence["groups"][1]["evidence_sha256"] == "877c2db7ac62c09dfdc91c38e2a41dce7dea8d741d71c02556664a6006423244"
          assert evidence["verdict"] == "reject_reopening_completed_same_asset_spot_perpetual_ohlc_price_discovery_mechanisms_1h_v1"
          assert evidence["canonical_mutation"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          assert all(value is None for value in evidence["performance"].values())
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          assert (out / "evidence.sha256").read_text().strip() == sha(out / "evidence.json")
          assert (out / "report.sha256").read_text().strip() == sha(out / "report.md")
          assert (out / "manifest.sha256").read_text().strip() == sha(out / "manifest.json")
          print(json.dumps({"evidence_sha256": sha(out / "evidence.json"), "report_sha256": sha(out / "report.md"), "manifest_sha256": sha(out / "manifest.json")}, sort_keys=True))
          PY

      - name: Upload exact-head closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-perpetual-ohlc-price-discovery-closure-1h-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/research/causal-same-asset-spot-perpetual-ohlc-price-discovery-programme-closure-1h-v1/
          if-no-files-found: error
          retention-days: 90
