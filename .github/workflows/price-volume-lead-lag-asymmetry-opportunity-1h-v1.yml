name: Price volume lead lag asymmetry diagnostic 1H v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  strategy-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OUTPUT_DIR: evidence/price-volume-lead-lag-asymmetry-opportunity-1h-v1

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run frozen bilateral information diagnostic
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/run_price_volume_lead_lag_asymmetry_opportunity_1h_v1.py \
            --tested-head "$TESTED_HEAD" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify immutable evidence
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("evidence/price-volume-lead-lag-asymmetry-opportunity-1h-v1")
          evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
          assert evidence["tested_head"] == os.environ["TESTED_HEAD"]
          assert evidence["family_id"] == (
              "causal-own-price-volume-lead-lag-asymmetry-opportunity-1h-v1"
          )
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["source_period"]["rows_per_target"] == 24144
          assert evidence["source_period"]["bar"] == "1H"
          assert evidence["source_period"]["effective_first_anchor_repair"] == 2208
          assert evidence["controls"]["sealed_oos_accessed"] is False
          assert evidence["verdict"] in {
              "accept_causal_own_price_volume_lead_lag_asymmetry_information_premise_1h_v1",
              "reject_causal_own_price_volume_lead_lag_asymmetry_information_premise_1h_v1",
              "reject_causal_own_price_volume_lead_lag_asymmetry_source_contract_1h_v1",
          }
          if evidence["source_contract_passed"]:
              assert set(evidence["results"]) == {"LTC-USDT", "DOGE-USDT"}
          for hash_path in root.rglob("*.sha256"):
              source_path = hash_path.with_name(hash_path.name[:-7])
              assert source_path.is_file()
              actual = hashlib.sha256(source_path.read_bytes()).hexdigest()
              assert actual == hash_path.read_text(encoding="utf-8").strip()
          PY

      - name: Upload immutable exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-volume-lead-lag-asymmetry-${{ github.event.pull_request.head.sha }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
