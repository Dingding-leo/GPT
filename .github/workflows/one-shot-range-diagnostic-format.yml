name: One-shot range diagnostic format

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-range-diagnostic-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Install formatter
        run: python -m pip install "ruff==0.16.1"
      - name: Apply canonical formatting and push
        shell: bash
        run: |
          set -euo pipefail
          target="reports/research/range-acceptance-continuation-opportunity-diagnostic-1h-v1/run_diagnostic.py"
          ruff format "$target"
          if git diff --quiet -- "$target"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "style: format range-acceptance diagnostic"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
