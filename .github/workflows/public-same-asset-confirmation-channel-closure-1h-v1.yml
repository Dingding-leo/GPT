name: Public Same-Asset Confirmation Channel Closure 1H v1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_public_same_asset_confirmation_channel_closure_1h_v1.py"
      - ".github/workflows/public-same-asset-confirmation-channel-closure-1h-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-same-asset-confirmation-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/public-same-asset-confirmation-channel-closure-1h-v1
      ARTIFACT_NAME: public-same-asset-confirmation-channel-closure-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute completed-evidence closure
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          python -m py_compile scripts/run_public_same_asset_confirmation_channel_closure_1h_v1.py
          python scripts/run_public_same_asset_confirmation_channel_closure_1h_v1.py --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable closure evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/evidence.json"
          test -s "$OUTPUT_DIR/evidence.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/evidence.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads((Path(os.environ["OUTPUT_DIR"]) / "evidence.json").read_text())
          assert evidence["family_id"] == "causal-public-same-asset-confirmation-channel-closure-1h-v1"
          assert evidence["research_parent"] == "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          assert evidence["bar"] == "1H"
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["architecture_group_count"] == 2
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_market_data"] == 0
          assert evidence["new_oos_consumed"] == 0
          assert evidence["performance_recomputed"] is False
          assert evidence["supportive_group_count"] == 0
          assert evidence["source_executable_group_count"] == 1
          assert evidence["material_training_decision_group_count"] == 0
          assert evidence["family_gates_passed"] == 1
          assert evidence["family_gate_count"] == 7
          assert all(item["family_support_retained"] is False for item in evidence["leave_one_group_out"].values())
          assert evidence["correction_permitted"] is False
          assert evidence["correction_applied"] is False
          assert evidence["observation_epoch_restarted"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          assert evidence["verdict"] == "reject_causal_public_same_asset_confirmation_channel"
          assert evidence["groups"][0]["source_issue"] == 889
          assert evidence["groups"][0]["source_pull_request"] == 890
          assert evidence["groups"][0]["performance_accessed"] is False
          assert evidence["groups"][1]["source_issue"] == 891
          assert evidence["groups"][1]["source_pull_request"] == 893
          assert evidence["groups"][1]["source_contract_executable"] is False
          assert evidence["groups"][1]["performance_accessed"] is False
          assert evidence["cross_sectional_selection"] is False
          assert evidence["pairs_or_spreads"] is False
          assert evidence["market_neutral"] is False
          assert evidence["credentials_used"] is False
          assert evidence["accounts_accessed"] is False
          assert evidence["orders_placed"] is False
          PY

      - name: Upload immutable closure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
