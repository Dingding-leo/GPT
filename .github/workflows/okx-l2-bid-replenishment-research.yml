name: OKX L2 Bid Replenishment Research

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_okx_l2_bid_replenishment_diagnostic.py"
      - ".github/workflows/okx-l2-bid-replenishment-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-l2-bid-replenishment-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PIP_BOOTSTRAP_VERSION: "26.1.2"
  METADATA_ARTIFACT: okx-l2-frozen-metadata-${{ github.run_number }}-attempt-${{ github.run_attempt }}
  DAY_ARTIFACT_PREFIX: okx-l2-day-${{ github.run_number }}-attempt-${{ github.run_attempt }}
  FINAL_ARTIFACT: okx-l2-bid-replenishment-${{ github.run_number }}-attempt-${{ github.run_attempt }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify focused source
        run: |
          ruff check --ignore E501 scripts/run_okx_l2_bid_replenishment_diagnostic.py
          python -m py_compile scripts/run_okx_l2_bid_replenishment_diagnostic.py

      - name: Freeze official source URLs and declared sizes
        run: |
          python scripts/run_okx_l2_bid_replenishment_diagnostic.py metadata \
            --base-url https://www.okx.com \
            --output-dir frozen-metadata

      - name: Verify frozen source byte gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("frozen-metadata/source-manifest.json").read_text())
          assert manifest["family_id"] == "okx-l2-bid-replenishment-resilience-opportunity-diagnostic-1h-v1"
          assert manifest["source_object_count"] == 24
          assert manifest["byte_gate_passed"] is True
          assert manifest["economic_values_read"] is False
          assert manifest["largest_object_bytes"] <= manifest["per_object_ceiling_bytes"]
          assert manifest["declared_compressed_bytes"] <= manifest["cumulative_ceiling_bytes"]
          assert len(manifest["metadata_responses"]) == 24
          PY

      - name: Upload immutable frozen metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata/
          if-no-files-found: error
          retention-days: 30

  process_day:
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - {market: BTC-USDT, anchor: "2025-01-07"}
          - {market: BTC-USDT, anchor: "2025-02-04"}
          - {market: BTC-USDT, anchor: "2025-03-04"}
          - {market: BTC-USDT, anchor: "2025-04-01"}
          - {market: BTC-USDT, anchor: "2025-05-06"}
          - {market: BTC-USDT, anchor: "2025-06-03"}
          - {market: BTC-USDT, anchor: "2025-07-01"}
          - {market: BTC-USDT, anchor: "2025-08-05"}
          - {market: BTC-USDT, anchor: "2025-09-02"}
          - {market: BTC-USDT, anchor: "2025-10-07"}
          - {market: BTC-USDT, anchor: "2025-11-04"}
          - {market: BTC-USDT, anchor: "2025-12-02"}
          - {market: ETH-USDT, anchor: "2025-01-07"}
          - {market: ETH-USDT, anchor: "2025-02-04"}
          - {market: ETH-USDT, anchor: "2025-03-04"}
          - {market: ETH-USDT, anchor: "2025-04-01"}
          - {market: ETH-USDT, anchor: "2025-05-06"}
          - {market: ETH-USDT, anchor: "2025-06-03"}
          - {market: ETH-USDT, anchor: "2025-07-01"}
          - {market: ETH-USDT, anchor: "2025-08-05"}
          - {market: ETH-USDT, anchor: "2025-09-02"}
          - {market: ETH-USDT, anchor: "2025-10-07"}
          - {market: ETH-USDT, anchor: "2025-11-04"}
          - {market: ETH-USDT, anchor: "2025-12-02"}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e .
          python -m pip check

      - name: Download frozen metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata

      - name: Replay one provider-ordered L2 archive
        run: |
          python scripts/run_okx_l2_bid_replenishment_diagnostic.py process-day \
            --manifest-path frozen-metadata/source-manifest.json \
            --market "${{ matrix.market }}" \
            --anchor "${{ matrix.anchor }}" \
            --output-dir day-result

      - name: Verify day evidence
        env:
          MARKET: ${{ matrix.market }}
          ANCHOR: ${{ matrix.anchor }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("day-result") / f"{os.environ['MARKET']}-{os.environ['ANCHOR']}.json"
          result = json.loads(path.read_text())
          assert result["family_id"] == "okx-l2-bid-replenishment-resilience-opportunity-diagnostic-1h-v1"
          assert result["market"] == os.environ["MARKET"]
          assert result["anchor_date_utc"] == os.environ["ANCHOR"]
          assert result["sequence_continuity_passed"] is True
          assert result["source_day_complete"] is True
          assert result["boundary_count"] == 289
          assert result["valid_hour_count"] >= 23
          assert result["compressed_bytes"] > 0
          assert len(result["compressed_sha256"]) == 64
          PY

      - name: Upload processed day evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DAY_ARTIFACT_PREFIX }}-${{ matrix.market }}-${{ matrix.anchor }}
          path: day-result/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [metadata, process_day]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e .
          python -m pip check

      - name: Download frozen metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.METADATA_ARTIFACT }}
          path: frozen-metadata

      - name: Download all processed L2 days
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.DAY_ARTIFACT_PREFIX }}-*
          path: processed-days
          merge-multiple: true

      - name: Compute frozen labels, inference, delay and verdict
        run: |
          python scripts/run_okx_l2_bid_replenishment_diagnostic.py aggregate \
            --manifest-path frozen-metadata/source-manifest.json \
            --days-root processed-days \
            --output-dir final-evidence

      - name: Verify terminal strategy evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("final-evidence")
          evidence_bytes = (root / "evidence.json").read_bytes()
          evidence = json.loads(evidence_bytes)
          manifest_bytes = (root / "source-manifest.json").read_bytes()
          assert evidence["family_id"] == "okx-l2-bid-replenishment-resilience-opportunity-diagnostic-1h-v1"
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["new_oos_consumed"] is False
          assert evidence["fee_one_way"] == 0.0005
          assert evidence["round_trip_label_fee"] == 0.001
          assert evidence["source"]["object_count"] == 24
          assert evidence["source"]["source_days_complete"] == 24
          assert evidence["source_manifest_sha256"] == hashlib.sha256(manifest_bytes).hexdigest()
          for market in ("BTC-USDT", "ETH-USDT"):
              assert evidence["primary"][market]["observations"] >= 264
              assert evidence["one_hour_delay"][market]["observations"] >= 264
          assert evidence["verdict"] in {
              "accept_okx_l2_bid_replenishment_resilience_information_premise",
              "reject_okx_l2_bid_replenishment_resilience_information_premise",
          }
          for required in ("report.md", "evidence.json", "source-manifest.json"):
              assert (root / required).is_file()
          print("evidence_sha256", hashlib.sha256(evidence_bytes).hexdigest())
          PY

      - name: Upload immutable terminal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.FINAL_ARTIFACT }}
          path: final-evidence/
          if-no-files-found: error
          retention-days: 30
