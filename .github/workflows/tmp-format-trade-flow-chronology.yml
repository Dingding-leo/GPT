name: Temporary Trade Flow Chronology Formatter

on:
  push:
    branches:
      - auto/research/20260728-24-trade-flow-chronology-clean

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip formatter]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --fix scripts/verify_okx_trade_flow_chronology.py tests/test_okx_historical_trades.py
      - run: ruff format scripts/verify_okx_trade_flow_chronology.py tests/test_okx_historical_trades.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-format-trade-flow-chronology.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format trade-flow chronology follow-up [skip formatter]"
          git push origin HEAD:${GITHUB_REF_NAME}
