name: E2160 Daily Decision Phase Robustness 1H

on:
  pull_request:
    paths:
      - "scripts/run_e2160_daily_decision_phase_robustness.py"
      - ".github/workflows/e2160-daily-decision-phase-robustness-1h.yml"
  push:
    branches:
      - "auto/research/**"
    paths:
      - "scripts/run_e2160_daily_decision_phase_robustness.py"
      - ".github/workflows/e2160-daily-decision-phase-robustness-1h.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$expected" = "$actual"
          [[ "$actual" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify focused script parses
        run: python -m py_compile scripts/run_e2160_daily_decision_phase_robustness.py

      - name: Retrieve frozen repository artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2160-sources
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/e2160-sources/btc.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8704977298/zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/e2160-sources/eth.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8704978112/zip"
          test -s /tmp/e2160-sources/btc.zip
          test -s /tmp/e2160-sources/eth.zip

      - name: Execute frozen 24-phase real-data audit
        env:
          RESEARCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_e2160_daily_decision_phase_robustness.py \
            --btc-artifact /tmp/e2160-sources/btc.zip \
            --eth-artifact /tmp/e2160-sources/eth.zip

      - name: Verify terminal evidence contract
        shell: bash
        run: |
          set -euo pipefail
          root="reports/research/e2160-daily-decision-phase-robustness-audit-1h-v1"
          test -s "${root}/evidence.json"
          test -s "${root}/manifest.json"
          test -s "${root}/report.md"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("reports/research/e2160-daily-decision-phase-robustness-audit-1h-v1")
          evidence_bytes = (root / "evidence.json").read_bytes()
          evidence = json.loads(evidence_bytes)
          manifest = json.loads((root / "manifest.json").read_text())
          expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          assert evidence["code_head"] == expected
          assert evidence["family_id"] == "canonical-e2160-daily-decision-phase-robustness-audit-1h-v1"
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["mandatory_phase_stress_count"] == 24
          assert evidence["bar"] == "1H"
          assert evidence["fee_bps_one_way"] == 5.0
          assert evidence["sample"]["later_suffix_unparsed_and_unscored"] is True
          assert evidence["phase_selection_authorized"] is False
          assert evidence["phase_aggregation_authorized"] is False
          assert evidence["canonical_mutation"] is False
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          assert set(evidence["markets"]) == {"BTC-USDT", "ETH-USDT"}
          assert all(
              evidence["markets"][market]["legacy_phase0_parity"]["passes"]
              for market in evidence["markets"]
          )
          assert manifest["evidence_sha256"] == hashlib.sha256(evidence_bytes).hexdigest()
          assert evidence["verdict"] in {
              "support_canonical_e2160_daily_decision_phase_robustness_1h_v1",
              "reject_canonical_e2160_daily_decision_phase_robustness_1h_v1",
          }
          print(evidence["verdict"])
          print("EVIDENCE_SHA256", manifest["evidence_sha256"])
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2160-daily-decision-phase-robustness-1h-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/research/e2160-daily-decision-phase-robustness-audit-1h-v1
          if-no-files-found: error
          retention-days: 30
