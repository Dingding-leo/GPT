name: Candle Efficiency 1H Research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candle-efficiency-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OKX_BASE_URL: https://www.okx.com
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run candle-efficiency structural tests
        run: pytest tests/test_candle_efficiency_state.py

      - name: Run bilateral real-data diagnostic
        run: python scripts/run_candle_efficiency_state.py

      - name: Upload immutable strategy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candle-efficiency-state-1h-${{ github.event.pull_request.head.sha }}
          path: reports/research/candle-efficiency-state-1h-v1/
          if-no-files-found: error
          retention-days: 14
