name: Historical Analog Consensus 1H Research

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/causal-historical-analog-consensus-abstention-1h-v1.yml"
      - "reports/research/causal-historical-analog-consensus-abstention-1h-v1/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RESEARCH_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  REPORT_DIR: reports/research/causal-historical-analog-consensus-abstention-1h-v1
  SOURCE_PATH: reports/research/causal-historical-analog-consensus-abstention-1h-v1/run_historical_analog.py
  SOURCE_B64_PATH: reports/research/causal-historical-analog-consensus-abstention-1h-v1/run_historical_analog.py.gz.b64
  PATCH_PATH: reports/research/causal-historical-analog-consensus-abstention-1h-v1/apply_breadth_repair.py
  FROZEN_SOURCE_SHA: 6267b0a1be676bacb390dbd5f3ae75b8db82c6b3
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checked-out revision
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"

      - name: Set up fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install fixed research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "ruff==0.16.1"

      - name: Materialize repaired deterministic reproducer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/analog-output /tmp/analog-cache
          test -f "$PATCH_PATH"
          git fetch --no-tags --depth=1 origin "$FROZEN_SOURCE_SHA"
          git show "$FROZEN_SOURCE_SHA:$SOURCE_PATH" > /tmp/analog-output/materialized_source.py
          python "$PATCH_PATH" /tmp/analog-output/materialized_source.py
          ruff check /tmp/analog-output/materialized_source.py
          ruff format --check /tmp/analog-output/materialized_source.py
          python -m py_compile /tmp/analog-output/materialized_source.py
          sha256sum /tmp/analog-output/materialized_source.py

      - name: Run immutable public-data strategy experiment
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/analog-output/materialized_source.py \
            --output-dir /tmp/analog-output \
            --cache-dir /tmp/analog-cache \
            | tee /tmp/analog-output/stdout.json
          (cd /tmp/analog-output && sha256sum -c source-manifest.sha256)
          (cd /tmp/analog-output && sha256sum -c training-freeze.sha256)
          (cd /tmp/analog-output && sha256sum -c evidence.sha256)

      - name: Reproduce exact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/analog-replay
          python /tmp/analog-output/materialized_source.py \
            --output-dir /tmp/analog-replay \
            --cache-dir /tmp/analog-cache
          for file in source-manifest.json source-manifest.sha256 training-freeze.json training-freeze.sha256 evidence.json evidence.sha256 report.md; do
            cmp "/tmp/analog-output/$file" "/tmp/analog-replay/$file"
          done

      - name: Verify frozen protocol and evidence identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("/tmp/analog-output/evidence.json").read_text())
          assert evidence["family_id"] == "causal-historical-analog-consensus-abstention-1h-v1"
          assert evidence["candidate_count"] == 2
          assert evidence["parameter_grid_count"] == 0
          assert evidence["symbols"] == ["ALGOUSDT", "ATOMUSDT"]
          assert evidence["bar"] == "1h"
          assert evidence["fee_one_way"] == 0.0005
          assert evidence["feature_window"] == 168
          assert evidence["block_hours"] == 6
          assert evidence["feature_count"] == 28
          assert evidence["neighbours"] == 12
          assert evidence["separation_hours"] == 168
          assert evidence["label_hours"] == 24
          assert evidence["entry"] == {"median_gross_gt": 0.001, "fee_clear_count_gte": 9}
          assert evidence["exit"] == {"median_gross_lte": 0.0, "fee_clear_count_lte": 5}
          assert evidence["bootstrap"] == {"draws": 5000, "block_hours": 168, "seed": 20260801}
          assert evidence["oos_opened_after_training_freeze"] is True
          for market in evidence["markets"].values():
              assert market["source"]["objects"] == 33
              assert market["source"]["rows"] == 24144
              assert market["integrity"]["all"] is True
              assert market["oos_breadth"]["method"] == "contiguous slices of isolated continuous OOS paths"
              assert market["segments"]["training"]["decision_count"] == 360
              assert market["segments"]["oos"]["decision_count"] == 540
              assert market["segments"]["full"]["decision_count"] == 900
          PY

      - name: Persist corrected reproducer and terminal evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/analog-output/materialized_source.py "$SOURCE_PATH"
          rm -f "$SOURCE_B64_PATH"
          for file in source-manifest.json source-manifest.sha256 training-freeze.json training-freeze.sha256 evidence.json evidence.sha256 report.md; do
            cp "/tmp/analog-output/$file" "$REPORT_DIR/$file"
          done
          git add -A "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo 'Exact corrected strategy evidence already persisted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'research: persist corrected analog breadth evidence'
          git push origin "HEAD:$RESEARCH_BRANCH"

      - name: Build immutable artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/analog-output -maxdepth 1 -type f \
            ! -name artifact-files.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/analog-output/artifact-files.sha256

      - name: Upload immutable strategy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: causal-historical-analog-consensus-abstention-1h-v1
          path: /tmp/analog-output
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
