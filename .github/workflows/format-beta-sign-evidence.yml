name: Format Beta Sign Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha }}
      PIP_BOOTSTRAP_VERSION: "26.1.2"

    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formatter
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_BOOTSTRAP_VERSION}"
          python -m pip install -e ".[dev]"

      - name: Format deterministic reproducer
        run: |
          set -euo pipefail
          ruff check reports/research/beta-sign-soft-exit-sleeve-1h-v1/reproduce.py
          ruff format reports/research/beta-sign-soft-exit-sleeve-1h-v1/reproduce.py
          ruff format --check reports/research/beta-sign-soft-exit-sleeve-1h-v1/reproduce.py
          sha256sum reports/research/beta-sign-soft-exit-sleeve-1h-v1/reproduce.py

      - name: Upload exact formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-sign-formatted-reproducer-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: reports/research/beta-sign-soft-exit-sleeve-1h-v1/reproduce.py
          if-no-files-found: error
          retention-days: 1
