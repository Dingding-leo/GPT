name: Public Spot Borrow Rate Source Contract 1H V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_public_spot_borrow_rate_source_contract_1h_v1.py"
      - ".github/workflows/public-spot-borrow-rate-source-contract-1h-v1.yml"
      - "ruff.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spot-borrow-rate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/public-spot-borrow-rate-source-contract-1h-v1
      ARTIFACT_NAME: public-spot-borrow-rate-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact research revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          python -m py_compile scripts/run_public_spot_borrow_rate_source_contract_1h_v1.py

      - name: Acquire bilateral public 1H rate panels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$OUTPUT_DIR/raw/acquisition-a/btc" \
            "$OUTPUT_DIR/raw/acquisition-a/eth" \
            "$OUTPUT_DIR/raw/acquisition-b/btc" \
            "$OUTPUT_DIR/raw/acquisition-b/eth" \
            "$OUTPUT_DIR/raw/probes"
          python scripts/run_public_spot_borrow_rate_source_contract_1h_v1.py \
            --tested-head "$EXPECTED_TESTED_SHA" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify terminal source evidence
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            evidence.json evidence.json.sha256 \
            semantic_contract.json semantic_contract.json.sha256 \
            source_manifest.json source_manifest.json.sha256 \
            report.md report.md.sha256 \
            artifact_summary.json artifact_summary.json.sha256; do
            test -s "$OUTPUT_DIR/$file"
          done
          test "$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/evidence.json.sha256")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              (Path(os.environ["OUTPUT_DIR"]) / "evidence.json").read_text()
          )
          assert evidence["family_id"] == (
              "causal-public-spot-borrow-rate-source-contract-1h-v1"
          )
          assert evidence["tested_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["repository_main"] == (
              "5a0fcc97d1a882f8223656c51f5bb8055f534e38"
          )
          assert evidence["issue"] == 986
          assert evidence["bar"] == "1H"
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["expected_rows_per_arm"] == 24144
          assert evidence["endpoint"] == (
              "/api/v5/finance/savings/lending-rate-history"
          )
          assert len(evidence["source_arms"]) == 2
          assert {arm["asset"] for arm in evidence["source_arms"]} == {
              "BTC",
              "ETH",
          }
          assert evidence["source_contract_passed"] == (
              evidence["source_arms_passing"] == 2
          )
          assert all(value is None for value in evidence["economics"].values())
          if evidence["source_contract_passed"]:
              for arm in evidence["source_arms"]:
                  assert arm["observed_rows"] == 24144
                  assert arm["source_contract_passed"] is True
                  assert arm["repeat_acquisition_identical"] is True
                  assert all(arm["checks"].values())
          PY

      - name: Upload immutable source-contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
