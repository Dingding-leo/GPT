name: Return-Sign Mixture E-Process Shift 1H V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_return_sign_mixture_eprocess_shift_1h_v1.py"
      - ".github/workflows/return-sign-mixture-eprocess-shift-1h-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: return-sign-mixture-eprocess-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  frozen-information-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/experiments/causal-own-price-return-sign-mixture-eprocess-shift-opportunity-1h-v1
      ARTIFACT_NAME: return-sign-mixture-eprocess-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable strategy boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"
          ! grep -EIn '(/private/|place_order\(|create_order\(|submit_order\()' \
            scripts/run_return_sign_mixture_eprocess_shift_1h_v1.py
          ! grep -EIn '(resample\(|cointegration|market.neutral|rank.*asset)' \
            scripts/run_return_sign_mixture_eprocess_shift_1h_v1.py

      - name: Install exact project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Compile frozen diagnostic
        run: python -m py_compile scripts/run_return_sign_mixture_eprocess_shift_1h_v1.py

      - name: Execute bilateral training-only information test
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$EXPECTED_TESTED_SHA"
          python scripts/run_return_sign_mixture_eprocess_shift_1h_v1.py \
            --output-dir "$OUTPUT_DIR"

      - name: Validate machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/evidence.json"
          test -s "$OUTPUT_DIR/evidence.sha256"
          test -s "$OUTPUT_DIR/report.md"
          test -s "$OUTPUT_DIR/training-records.json"
          test "$(sha256sum "$OUTPUT_DIR/evidence.json" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/evidence.sha256")"
          test "$(sha256sum "$OUTPUT_DIR/report.md" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/report.md.sha256")"
          test "$(sha256sum "$OUTPUT_DIR/training-records.json" | awk '{print $1}')" = \
            "$(cat "$OUTPUT_DIR/training-records.json.sha256")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((root / "evidence.json").read_text())
          assert evidence["exact_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["candidate_count"] == 0
          assert evidence["parameter_grid_count"] == 0
          assert evidence["fixed_targets"] == ["XLM-USDT", "ICP-USDT"]
          assert evidence["bar"] == "1H"
          assert evidence["expected_rows_per_target"] == 24144
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["mixture_lambdas"] == [0.1, 0.25, 0.5, 0.75]
          assert evidence["bootstrap_draws"] == 5000
          assert evidence["bootstrap_block_opportunities"] == 7
          assert evidence["sealed_oos_performance_accessed"] is False
          assert evidence["canonical_mutation"] is False
          assert len(evidence["targets"]) == 2
          assert all(value is False for value in evidence["controls"].values())
          for target in evidence["targets"]:
              source = target["source"]
              assert source["rows"] == 24144
              assert source["exact_byte_replay_identical"] is True
              assert source["repeated_acquisition_identical"] is True
              assert source["repeated_normalization_identical"] is True
              assert source["synthetic_rows"] == 0
              assert target["dependence_uncertainty"]["draws"] == 5000
              assert len(target["fold_breadth"]["folds"]) == 4
              assert target["prefix_invariance"]["records_identical"] is True
              assert target["strategy_metrics"]["oos_return"] is None
          allowed = {
              "reject_causal_own_price_return_sign_mixture_eprocess_shift_information_premise_1h_v1",
              "accept_causal_own_price_return_sign_mixture_eprocess_shift_information_premise_1h_v1_for_separate_candidate_predeclaration",
          }
          assert evidence["verdict"] in allowed
          print("VERDICT=" + evidence["verdict"])
          print("BILATERAL_PASS=" + str(evidence["bilateral_information_pass"]))
          print("FAILING_GATES=" + json.dumps(evidence["failing_gates"], sort_keys=True))
          PY
          echo "EVIDENCE_SHA256=$(cat "$OUTPUT_DIR/evidence.sha256")"
          echo "REPORT_SHA256=$(cat "$OUTPUT_DIR/report.md.sha256")"
          echo "TRAINING_RECORDS_SHA256=$(cat "$OUTPUT_DIR/training-records.json.sha256")"

      - name: Upload immutable exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
