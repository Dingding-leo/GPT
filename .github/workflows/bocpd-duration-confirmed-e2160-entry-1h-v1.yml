name: BOCPD Duration-Confirmed E2160 Entry 1H Research

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bocpd-duration-confirmed-e2160-entry-1h-v1.yml"
      - "reports/research/bocpd-duration-confirmed-e2160-entry-1h-v1/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to verify
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: bocpd-duration-confirmed-${{ github.event_name }}-${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_TESTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          git cat-file -e "0764bc7bc1e574fb891e1b2907e060f48ac19c67^{commit}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install standalone research dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scipy>=1.14,<2" "ruff==0.16.1"

      - name: Materialize, repair frozen causal cut and evidence identity, then validate
        run: |
          python reports/research/bocpd-duration-confirmed-e2160-entry-1h-v1/run_research.py \
            --materialize artifacts/work/run_research_impl.py
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/work/run_research_impl.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "daily_targets = set(range(WARMUP_END, limit, 24))": (
                  "daily_targets = {execution_index for execution_index in "
                  "range(WARMUP_END, limit, 24) if execution_index > 2160}"
              ),
              "expected = (limit - WARMUP_END) // 24": "expected = len(daily_targets)",
              'os.environ.get("GITHUB_SHA", "local")': (
                  'os.environ.get("EXPECTED_TESTED_SHA", "local")'
              ),
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, old
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes --ignore E501 artifacts/work/run_research_impl.py
          ruff format artifacts/work/run_research_impl.py
          ruff check --ignore E501 artifacts/work/run_research_impl.py
          python -m compileall -q artifacts/work/run_research_impl.py

      - name: Acquire immutable public data and run frozen experiment
        run: python artifacts/work/run_research_impl.py

      - name: Verify terminal evidence contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("reports/experiments/bocpd-duration-confirmed-e2160-entry-1h-v1")
          evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
          assert evidence["family_id"] == "causal-bocpd-duration-confirmed-e2160-entry-1h-v1"
          assert evidence["exact_head"] == os.environ["EXPECTED_TESTED_SHA"]
          assert evidence["candidate_count"] == 2
          assert evidence["parameter_grid_count"] == 0
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["bar_interval"] == "1H"
          assert evidence["source_contract"]["objects_verified"] == 132
          assert evidence["source_contract"]["symbols"] == ["COMPUSDT", "LINKUSDT"]
          assert len(evidence["markets"]) == 2
          assert evidence["verdict"] in {
              "accept_causal_bocpd_duration_confirmed_e2160_entry_1h_v1",
              "reject_causal_bocpd_duration_confirmed_e2160_entry_1h_v1",
          }
          assert evidence["paper_trading_authorized"] is False
          assert evidence["live_trading_authorized"] is False
          PY

      - name: Publish terminal report
        run: cat reports/experiments/bocpd-duration-confirmed-e2160-entry-1h-v1/report.md

      - name: Prepare immutable evidence artifact
        run: |
          rm -rf reports/experiments/bocpd-duration-confirmed-e2160-entry-1h-v1/source
          cp artifacts/work/run_research_impl.py \
            reports/experiments/bocpd-duration-confirmed-e2160-entry-1h-v1/

      - name: Upload immutable research artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bocpd-duration-confirmed-e2160-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: reports/experiments/bocpd-duration-confirmed-e2160-entry-1h-v1
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
