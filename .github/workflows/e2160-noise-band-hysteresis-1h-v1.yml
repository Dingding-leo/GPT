name: E2160 noise-band hysteresis 1H v1 exact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  strategy-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUTPUT_DIR: evidence/e2160-noise-band-hysteresis-1h-v1

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run frozen bilateral strategy experiment
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/run_e2160_noise_band_hysteresis_1h_v1.py \
            --tested-head "$TESTED_HEAD" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify terminal immutable evidence
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("evidence/e2160-noise-band-hysteresis-1h-v1")
          evidence = json.loads((root / "evidence.json").read_text())
          expected_verdicts = {
              "accept_causal_own_price_e2160_noise_band_hysteresis_1h_v1_for_canonical_review",
              "reject_causal_own_price_e2160_noise_band_hysteresis_1h_v1",
          }
          assert evidence["tested_head"] == os.environ["TESTED_HEAD"]
          assert evidence["family_id"] == (
              "causal-own-price-e2160-noise-band-hysteresis-1h-v1"
          )
          assert evidence["verdict"] in expected_verdicts
          assert evidence["candidate_count"] == 1
          assert evidence["parameter_grid_count"] == 0
          assert evidence["canonical_fee_bps_one_way"] == 5.0
          assert evidence["source_period"]["rows_per_target"] == 24144
          assert set(evidence["results"]) == {"BTC-USDT", "ETH-USDT"}
          assert evidence["controls"]["credentials_accessed"] is False
          assert evidence["controls"]["accounts_accessed"] is False
          assert evidence["controls"]["orders_placed"] is False
          assert evidence["controls"]["leverage_used"] is False
          assert evidence["controls"]["synthetic_market_data"] is False
          assert evidence["controls"]["non_1h_input"] is False
          assert evidence["controls"]["paper_trading_authorized"] is False
          assert evidence["controls"]["live_trading_authorized"] is False
          for path in root.rglob("*.sha256"):
              source = path.with_name(path.name[:-7])
              assert source.is_file()
              assert hashlib.sha256(source.read_bytes()).hexdigest() == path.read_text().strip()
          PY

      - name: Upload immutable exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: e2160-noise-band-hysteresis-1h-v1-${{ github.event.pull_request.head.sha }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
