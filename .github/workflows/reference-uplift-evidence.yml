name: Reference Uplift Exit Bridge Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reference-uplift-evidence.yml"
      - "reports/research/reference-uplift-exit-bridge-1h-v1/.payload*"

permissions:
  contents: read

concurrency:
  group: reference-uplift-evidence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deterministic numerical dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==2.3.2"

      - name: Reconstruct and run frozen experiment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import pathlib
          import zlib

          root = pathlib.Path("reports/research/reference-uplift-exit-bridge-1h-v1")
          encoded = "".join((root / f".payload{i:02d}").read_text() for i in range(5))
          script = zlib.decompress(base64.b85decode(encoded.encode("ascii")))
          pathlib.Path("/tmp/run_reference_uplift.py").write_bytes(script)
          PY
          python /tmp/run_reference_uplift.py \
            --output-dir /tmp/reference-uplift-evidence \
            --end 2026-07-31T03:00:00Z

      - name: Upload immutable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-uplift-exit-bridge-evidence
          path: /tmp/reference-uplift-evidence/
          if-no-files-found: error
          retention-days: 30
