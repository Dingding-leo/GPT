name: Research Daily Margin Acceleration Confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_daily_margin_acceleration_confirmation.py"
      - "scripts/run_research_daily_margin_acceleration_confirmation.py"
      - ".github/workflows/research-daily-margin-acceleration-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-daily-margin-acceleration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/daily-margin-acceleration-confirmation-1h-v1
      ARTIFACT_NAME: daily-margin-acceleration-confirmation-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen public-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"
          python -m py_compile \
            scripts/research_daily_margin_acceleration_confirmation.py \
            scripts/run_research_daily_margin_acceleration_confirmation.py

      - name: Execute sole preregistered candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_research_daily_margin_acceleration_confirmation.py --output-dir "$OUTPUT_DIR"

      - name: Validate machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$expected" = "$actual"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["family_id"] == "daily-margin-acceleration-confirmation-1h-v1"
          assert result["issue"] == 753
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["candidate_count"] == 1
          assert result["parameter_grid_count"] == 0
          assert result["cross_sectional_selection"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["actual_orders"] is False
          assert result["paper_trading_authorized"] is False
          assert result["live_trading_authorized"] is False
          assert len(result["markets"]) == 2
          assert all(source["row_count"] == 43441 for source in result["sources"])
          assert all(source["contiguous_confirmed_grid_passed"] is True for source in result["sources"])
          assert result["verdict"] in {
              "accept_daily_margin_acceleration_confirmation",
              "reject_daily_margin_acceleration_confirmation_family",
          }
          PY

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
