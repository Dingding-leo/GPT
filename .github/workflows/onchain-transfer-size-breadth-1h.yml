name: On-chain Transfer Size Breadth 1H

on:
  push:
    branches:
      - "auto/research/**"
    paths:
      - "scripts/run_onchain_transfer_size_breadth.py"
      - ".github/workflows/onchain-transfer-size-breadth-1h.yml"
  pull_request:
    paths:
      - "scripts/run_onchain_transfer_size_breadth.py"
      - ".github/workflows/onchain-transfer-size-breadth-1h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile focused research script
        run: python -m py_compile scripts/run_onchain_transfer_size_breadth.py
      - name: Execute credential-free 1H source contract
        run: python scripts/run_onchain_transfer_size_breadth.py
      - name: Hash terminal evidence
        run: |
          sha256sum reports/research/onchain-transfer-size-breadth-1h-v1/evidence.json
          sha256sum reports/research/onchain-transfer-size-breadth-1h-v1/report.md
          sha256sum reports/research/onchain-transfer-size-breadth-1h-v1/manifest.json
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: onchain-transfer-size-breadth-1h-${{ github.sha }}
          path: reports/research/onchain-transfer-size-breadth-1h-v1
          if-no-files-found: error
          retention-days: 30
