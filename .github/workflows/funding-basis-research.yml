name: Funding Basis Strategy Research

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_funding_basis_crowding_research.py"
      - ".github/workflows/funding-basis-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-basis-research-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: reports/research/funding-basis-crowding-unwind-v2
    steps:
      - name: Check out exact strategy head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile strategy implementation
        run: python -m py_compile scripts/run_funding_basis_crowding_research.py

      - name: Run real public-data F0/F1 experiment
        env:
          GITHUB_SHA: ${{ env.EXPECTED_SHA }}
        run: |
          python scripts/run_funding_basis_crowding_research.py \
            --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$OUTPUT_DIR/result-summary.json" >/dev/null
          python -m json.tool "$OUTPUT_DIR/source-manifest.json" >/dev/null
          (cd "$OUTPUT_DIR" && sha256sum -c result-summary.sha256)
          test -d "$OUTPUT_DIR/raw"
          test "$(find "$OUTPUT_DIR/raw" -type f | wc -l)" -gt 0

      - name: Upload immutable funding-basis evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: funding-basis-crowding-v2-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30
