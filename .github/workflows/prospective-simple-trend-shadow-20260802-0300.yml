name: Prospective Simple Trend Shadow 20260802 0300

on:
  pull_request:
    branches:
      - auto/research/20260802-1158-prospective-simple-trend-shadow-20260802-0200
    paths:
      - "scripts/run_prospective_simple_trend_shadow_20260802_0300.py"
      - "scripts/run_prospective_simple_trend_shadow_20260802_0300_open.py"
      - ".github/workflows/prospective-simple-trend-shadow-20260802-0300.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-simple-trend-20260802-0300-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OKX_BASE_URL: https://www.okx.com
      OUTPUT_DIR: reports/prospective/simple-trend-20260802T0300Z
      ARTIFACT_NAME: prospective-simple-trend-20260802-0300-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public-only exact revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_TESTED_SHA"
          test -z "${{ secrets.OKX_API_KEY }}"
          test -z "${{ secrets.OKX_SECRET_KEY }}"
          test -z "${{ secrets.OKX_PASSPHRASE }}"

      - name: Execute frozen prospective checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_prospective_simple_trend_shadow_20260802_0300_open.py
          python scripts/run_prospective_simple_trend_shadow_20260802_0300_open.py --output-dir "$OUTPUT_DIR"

      - name: Verify machine-readable strategy evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/result.json"
          test -s "$OUTPUT_DIR/result.sha256"
          test -s "$OUTPUT_DIR/report.md"
          expected="$(cat "$OUTPUT_DIR/result.sha256")"
          actual="$(sha256sum "$OUTPUT_DIR/result.json" | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_DIR"]) / "result.json").read_text())
          assert result["policy_name"] == "simple_trend_long_cash_2160h_next_open"
          assert result["policy_sha256"] == "9dc8ab03368b61546a6ae7674f1f4127953404900ff1e09e066ecf9adf741131"
          assert result["bar"] == "1H"
          assert result["canonical_fee_bps_one_way"] == 5.0
          assert result["cross_sectional_selection"] is False
          assert result["actual_orders"] is False
          assert result["credentials_used"] is False
          assert result["private_endpoints_used"] is False
          assert result["enabled_adapters"] is False
          assert result["paper_trading_authorized"] is False
          assert result["live_trading_authorized"] is False
          assert result["checkpoint_type"] == "complete_signal_and_realized_payoff"
          assert result["window"]["prior_last_signal_bar_start"] == "2026-08-02T01:00:00Z"
          assert result["window"]["latest_complete_signal_bar_start"] == "2026-08-02T02:00:00Z"
          assert result["window"]["new_signal_bar_count"] == 1
          assert result["window"]["new_realized_payoff_intervals"] == 1
          assert result["window"]["prior_cumulative_realized_hours"] == 601
          assert result["window"]["updated_cumulative_realized_hours"] == 602
          assert result["window"]["realized_payoff_interval_start"] == "2026-08-02T02:00:00Z"
          assert result["window"]["realized_payoff_interval_end"] == "2026-08-02T03:00:00Z"
          assert result["prospective_lineage"]["prior_result_sha256"] == "81d1f1aeab006124bff108899c54e7ce44d8b21aa863a475bdb96e71e932756f"
          assert result["prospective_lineage"]["prior_artifact_sha256"] == "0e622a4458a936b14ab6a6d305853bd1f8306135d4ed7f85a8b59a2ec0222a81"
          assert result["prospective_lineage"]["policy_unchanged"] is True
          assert result["latest_terminal_candidate_context"]["issue"] == 943
          assert result["latest_terminal_candidate_context"]["pull_request"] == 946
          assert result["latest_terminal_candidate_context"]["economically_supportive_group_count"] == 0
          assert result["latest_terminal_candidate_context"]["dependence_supported_group_count"] == 0
          assert result["active_alpha_context"]["issue"] is None
          assert result["active_alpha_context"]["family_id"] is None
          assert result["active_alpha_context"]["status"] == "no_active_replacement_strategy_architecture"
          assert result["training_authorized_correction"]["permitted"] is False
          assert result["training_authorized_correction"]["applied"] is False
          assert result["training_authorized_correction"]["observation_epoch_restarted"] is False
          assert result["payoff_boundary_repair"]["applied"] is True
          assert result["payoff_boundary_repair"]["open_endpoint_only"] is True
          assert result["payoff_boundary_repair"]["future_signal_accessed"] is False
          assert result["payoff_boundary_repair"]["strategy_value_changed"] is False
          assert result["payoff_boundary_repair"]["source_changed"] is False
          assert result["payoff_boundary_repair"]["fee_changed"] is False
          assert result["payoff_boundary_repair"]["architecture_changed"] is False
          assert result["payoff_end_open_boundary"]["timestamp"] == "2026-08-02T03:00:00Z"
          assert result["payoff_end_open_boundary"]["field_used"] == "open"
          assert result["payoff_end_open_boundary"]["provider_confirm_required"] is False
          assert result["payoff_end_open_boundary"]["used_only_as_realized_payoff_endpoint"] is True
          assert result["payoff_end_open_boundary"]["used_for_signal"] is False
          assert result["strategy_facing_discrepancy"]["policy_or_accounting_defect_detected"] is False
          assert result["aggregate_forward_scorecard"]["realized_interval_count"] == 10
          assert len(result["markets"]) == 2
          assert all(len(m["new_decisions"]) == 1 for m in result["markets"])
          assert all(m["new_signal_observations"] == 1 for m in result["markets"])
          assert all(m["recent_forward_window"]["realized_interval_count"] == 5 for m in result["markets"])
          assert all(s["grid"]["contiguous_confirmed_grid_passed"] is True for s in result["sources"])
          assert result["abort_conditions"]["triggered"] is False
          assert result["machine_readable_verdict"]["new_signal_bar_count"] == 1
          assert result["machine_readable_verdict"]["new_realized_payoff_intervals"] == 1
          assert result["machine_readable_verdict"]["payoff_end_open_only"] is True
          assert result["machine_readable_verdict"]["future_signal_accessed"] is False
          assert result["machine_readable_verdict"]["strategy_value_changed"] is False
          assert result["machine_readable_verdict"]["policy_changed"] is False
          assert result["machine_readable_verdict"]["live_trading_authorized"] is False
          assert result["verdict"] in {
              "prospective_simple_trend_no_trade_continues",
              "prospective_simple_trend_exposure_observed_continue_shadow_only",
          }

          compact = {
              "verdict": result["verdict"],
              "checkpoint_type": result["checkpoint_type"],
              "window": result["window"],
              "markets": [
                  {
                      "instrument": market["instrument"],
                      "new_margin": market["new_decisions"][0]["margin"],
                      "new_target": market["new_decisions"][0]["target"],
                      "position": market["realized_interval"]["position"],
                      "realized_net": market["realized_interval"]["net_strategy_return"],
                      "benchmark": market["realized_interval"]["asset_return"],
                      "residual": market["realized_interval"]["strategy_residual_vs_buy_and_hold"],
                      "turnover": market["realized_interval"]["turnover"],
                      "fee": market["realized_interval"]["modeled_fee"],
                      "five_interval": market["recent_forward_window"],
                  }
                  for market in result["markets"]
              ],
              "drift": result["strategy_facing_discrepancy"],
              "payoff_end_open_boundary": result["payoff_end_open_boundary"],
              "latest_terminal_candidate_context": result["latest_terminal_candidate_context"],
          }
          print("STRATEGY_COMPACT_JSON=" + json.dumps(compact, sort_keys=True))
          PY
          echo "RESULT_SHA256=$(cat "$OUTPUT_DIR/result.sha256")"
          echo "REPORT_SHA256=$(sha256sum "$OUTPUT_DIR/report.md" | awk '{print $1}')"

      - name: Upload immutable prospective evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
